              note: Customer prefers delivery before 1 December.
      responses:
        '200':
          description: Updated enquiry.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AdminEnquiry' }
              example:
                data:
                  id: 123
                  reference: GND-ENQ-000123
                  type: product
                  status: contacted
                  status_label: Contacted
                  created_at: '2026-10-09T10:15:00+00:00'
                  redirect_initiated_at: '2026-10-09T10:15:02+00:00'
                  product: Neelam Midnight Silk Lehenga Set
                  variant: M / Midnight Blue
                  quantity: 1
                  item_count: 1
                  display_total: '₹64,500'
                  lead_source: instagram
                  source_path: /products/neelam-midnight-silk-lehenga-set
                  contact: { name: Asha Example, phone: '+91 12345 67890', email: asha@example.com }
                  assigned_to: { id: 3, name: Team Member }
                  follow_up_at: '2026-10-12T05:30:00+00:00'
                  is_overdue: false
                  customer_message: Is this available for a December wedding?
                  measurements: null
                  fitting_consultation_requested: false
                  preferred_date: null
                  attribution: { referrer: www.example.com, utm_source: instagram, utm_medium: social, utm_campaign: festive-edit }
                  customer: { id: 45, name: Asha Example, phone: '+91 12345 67890', email: asha@example.com, city: Pune, country: India, marketing_consent: false }
                  whatsapp_message: "Hello Grace New Designers,\n\nI'm interested in the following design:\n..."
                  items:
                    - id: 130
                      product_id: 1
                      product_variant_id: 2
                      product_name: Neelam Midnight Silk Lehenga Set
                      product_sku: GND-LEH-001
                      variant_sku: GND-LEH-001-M-MID
                      size_label: M
                      color_label: Midnight Blue
                      is_custom_size: false
                      quantity: 1
                      currency: INR
                      product_url: https://www.example.com/products/neelam-midnight-silk-lehenga-set
                      price_mode: fixed
                      unit_price: '64500.00'
                      price_label: '₹64,500'
                      product_exists: true
                  history:
                    - { from: null, to: new, note: Enquiry initiated from storefront, user: null, created_at: '2026-10-09T10:15:00+00:00' }
                    - { from: new, to: contacted, note: Shared fabric swatches on WhatsApp., user: Team Member, created_at: '2026-10-09T11:00:00+00:00' }
                  notes:
                    - { id: 9, body: Customer prefers delivery before 1 December., user: Team Member, created_at: '2026-10-09T11:00:00+00:00' }
                  order: null
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: ['Admin: Enquiries']
      operationId: adminDeleteEnquiry
      summary: Delete an enquiry
      description: '**Permission:** `enquiries.manage`. Soft delete.'
      responses:
        '204': { description: "Deleted." }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/enquiries/{enquiry}/notes:
    parameters:
      - $ref: '#/components/parameters/EnquiryIdPath'
    post:
      tags: ['Admin: Enquiries']
      operationId: adminAddEnquiryNote
      summary: Add an internal note
      description: '**Permission:** `enquiries.manage`. Responds 201 with an empty body.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 5000 }
      responses:
        '201': { description: "Note added (empty body)." }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/enquiries/{enquiry}/order-draft:
    parameters:
      - $ref: '#/components/parameters/EnquiryIdPath'
    get:
      tags: ['Admin: Orders']
      operationId: adminOrderDraftFromEnquiry
      summary: Prefill an order from an enquiry
      description: |
        **Permission:** `orders.manage`. Returns an `OrderRequest`-shaped draft from the enquiry's snapshots. The
        displayed `unit_price` is only a starting point — staff confirm the agreed price.
      responses:
        '200':
          description: Order draft.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/OrderDraft' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ============================================================================================
  # Admin — orders
  # ============================================================================================
  /api/v1/admin/orders:
    get:
      tags: ['Admin: Orders']
      operationId: adminListOrders
      summary: List orders
      description: '**Permission:** `orders.view`.'
      parameters:
        - { name: q, in: query, description: "Reference, customer name/phone or item name.", schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: payment_status, in: query, schema: { $ref: '#/components/schemas/PaymentStatus' } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 5, maximum: 100, default: 25 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Paginated order rows.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OrderListItem' }
                  meta: { $ref: '#/components/schemas/AdminListMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: ['Admin: Orders']
      operationId: adminCreateOrder
      summary: Record an order
      description: |
        **Permission:** `orders.manage`. Orders are recorded manually after the conversation on WhatsApp — the
        platform never takes or infers payment. Totals are computed server-side
        (`subtotal = Σ quantity × unit_price`, `total = subtotal − discount + shipping + tax`). An enquiry can have at
        most one order (422 on `enquiry_id`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Order' }
            example:
              enquiry_id: 123
              customer_id: 45
              status: confirmed
              payment_status: partially_paid
              payment_note: Advance received by bank transfer.
              currency: INR
              discount_amount: 2000
              shipping_amount: 0
              tax_amount: 0
              amount_paid: 30000
              requires_shipping: true
              shipping_name: Asha Example
              shipping_phone: '+91 12345 67890'
              shipping_line1: 12 Example Street
              shipping_city: Pune
              shipping_state: Maharashtra
              shipping_postal_code: '411001'
              shipping_country: India
              expected_delivery_date: '2026-11-20'
              items:
                - product_id: 1
                  product_variant_id: 2
                  size_label: M
                  color_label: Midnight Blue
                  quantity: 1
                  unit_price: 62500
                  notes: Blouse sleeves lengthened by 1 inch.
      responses:
        '201':
          description: Created order.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/OrderDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/orders/{order}:
    parameters:
      - { name: order, in: path, required: true, schema: { type: integer }, description: "Order id." }
    get:
      tags: ['Admin: Orders']
      operationId: adminGetOrder
      summary: Get an order
      description: '**Permission:** `orders.view`.'
      responses:
        '200':
          description: Order.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/OrderDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    patch:
      tags: ['Admin: Orders']
      operationId: adminUpdateOrder
      summary: Update an order
      description: |
        **Permission:** `orders.manage`. All fields optional; `enquiry_id` is prohibited. Items cannot change after
        stock has been committed, and cancelled orders cannot be reopened (422). Field changes are recorded in the
        order history (`status_note` annotates a status change).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderUpdate' }
      responses:
        '200':
          description: Updated order.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/OrderDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ============================================================================================
  # Admin — customers
  # ============================================================================================
  /api/v1/admin/customers:
    get:
      tags: ['Admin: Customers']
      operationId: adminListCustomers
      summary: List customers
      description: '**Permission:** `customers.view`. Anonymized customers are excluded.'
      parameters:
        - { name: q, in: query, description: "Name, phone or email contains.", schema: { type: string } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, default: 25 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Paginated customers.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CustomerListItem' }
                  meta: { $ref: '#/components/schemas/AdminListMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/customers/{customer}:
    parameters:
      - { name: customer, in: path, required: true, schema: { type: integer }, description: "Customer id." }
    get:
      tags: ['Admin: Customers']
