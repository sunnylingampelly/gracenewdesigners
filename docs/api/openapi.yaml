  # ============================================================================================
  # Admin — media
  # ============================================================================================
  /api/v1/admin/media:
    get:
      tags: ['Admin: Media']
      operationId: adminListMedia
      summary: List media assets
      description: |
        **Permission:** `media.view`. `orphaned=true` lists candidate orphans (not referenced by the main relational
        tables; JSON references such as homepage configs are checked on delete).
      parameters:
        - { name: q, in: query, description: "Matches file name, alt text or title.", schema: { type: string, maxLength: 100 } }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/MediaKind' } }
        - { name: folder, in: query, schema: { type: string, maxLength: 100 } }
        - { name: orphaned, in: query, schema: { type: boolean } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 10, maximum: 100, default: 40 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Paginated media assets (Laravel resource collection format).
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MediaAsset' }
                  links: { $ref: '#/components/schemas/PaginationLinks' }
                  meta: { $ref: '#/components/schemas/PaginatedMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: ['Admin: Media']
      operationId: adminUploadMedia
      summary: Upload a media file
      description: |
        **Permission:** `media.manage`. The MIME type is re-checked by content sniffing. Image renditions
        (`thumb`, `sm`, `md`, `lg`, …) are generated asynchronously (`processing_status`). Uploading a file whose
        checksum matches an existing asset returns that asset with **200** instead of 201.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: jpg, jpeg, png, webp, avif, mp4, webm or pdf; max 150 MB.
                alt_text: { type: [string, 'null'], maxLength: 300 }
                title: { type: [string, 'null'], maxLength: 255 }
                folder: { type: [string, 'null'], maxLength: 100, pattern: '^[a-z0-9\-]+$' }
      responses:
        '201':
          description: New asset.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MediaAsset' }
        '200':
          description: Duplicate upload — the existing asset.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MediaAsset' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/media/{medium}:
    parameters:
      - { name: medium, in: path, required: true, schema: { type: integer }, description: "Media asset id." }
    get:
      tags: ['Admin: Media']
      operationId: adminGetMedia
      summary: Get a media asset with usage counts
      description: '**Permission:** `media.view`.'
      responses:
        '200':
          description: Asset.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/MediaAsset'
                      - type: object
                        required: [usages]
                        properties:
                          usages:
                            description: Non-zero reference counts by area (`products`, `lookbooks`, `taxonomy`, `content`, `settings`). Empty array when unused.
                            anyOf:
                              - type: object
                                additionalProperties: { type: integer }
                              - type: array
                                maxItems: 0
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    patch:
      tags: ['Admin: Media']
      operationId: adminUpdateMedia
      summary: Update media metadata
      description: '**Permission:** `media.manage`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alt_text: { type: [string, 'null'], maxLength: 300 }
                title: { type: [string, 'null'], maxLength: 255 }
                folder: { type: [string, 'null'], maxLength: 100, pattern: '^[a-z0-9\-]+$' }
                focal_x: { type: [number, 'null'], minimum: 0, maximum: 1 }
                focal_y: { type: [number, 'null'], minimum: 0, maximum: 1 }
      responses:
        '200':
          description: Updated asset.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MediaAsset' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: ['Admin: Media']
      operationId: adminDeleteMedia
      summary: Delete a media asset
      description: '**Permission:** `media.manage`. 422 while the asset is still referenced anywhere.'
      responses:
        '204': { description: "Deleted." }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/media/{medium}/reprocess:
    parameters:
      - { name: medium, in: path, required: true, schema: { type: integer }, description: "Media asset id." }
    post:
      tags: ['Admin: Media']
      operationId: adminReprocessMedia
      summary: Re-generate renditions
      description: '**Permission:** `media.manage`. Resets `processing_status` to `pending` and queues processing.'
      responses:
        '200':
          description: Asset (pending).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MediaAsset' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ============================================================================================
  # Admin — enquiries
  # ============================================================================================
  /api/v1/admin/enquiries:
    get:
      tags: ['Admin: Enquiries']
      operationId: adminListEnquiries
      summary: List enquiries
      description: '**Permission:** `enquiries.view`. Newest first.'
      parameters:
        - $ref: '#/components/parameters/EnquiryQ'
        - $ref: '#/components/parameters/EnquiryStatusFilter'
        - $ref: '#/components/parameters/EnquiryTypeFilter'
        - $ref: '#/components/parameters/EnquiryAssignedTo'
        - $ref: '#/components/parameters/EnquiryFollowUp'
        - $ref: '#/components/parameters/EnquiryFrom'
        - $ref: '#/components/parameters/EnquiryTo'
        - $ref: '#/components/parameters/EnquiryProductId'
        - $ref: '#/components/parameters/EnquirySource'
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, default: 25 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Paginated enquiry rows with pipeline counts.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminEnquiryRow' }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/AdminListMeta'
                      - type: object
                        required: [counts]
                        properties:
                          counts:
                            type: object
                            properties:
                              new: { type: integer }
                              open: { type: integer }
                              overdue: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/enquiries/export:
    get:
      tags: ['Admin: Enquiries']
      operationId: adminExportEnquiries
      summary: Export enquiries as CSV
      description: |
        **Permission:** `enquiries.export`. Accepts the same filters as the list. UTF-8 CSV with BOM; dates in the
        operations timezone (IST); formula-like values are prefixed with `'`.
      parameters:
        - $ref: '#/components/parameters/EnquiryQ'
        - $ref: '#/components/parameters/EnquiryStatusFilter'
        - $ref: '#/components/parameters/EnquiryTypeFilter'
        - $ref: '#/components/parameters/EnquiryAssignedTo'
        - $ref: '#/components/parameters/EnquiryFollowUp'
        - $ref: '#/components/parameters/EnquiryFrom'
        - $ref: '#/components/parameters/EnquiryTo'
        - $ref: '#/components/parameters/EnquiryProductId'
        - $ref: '#/components/parameters/EnquirySource'
      responses:
        '200':
          description: CSV file (`enquiries-YYYY-MM-DD.csv`).
          headers:
            Content-Disposition:
              schema: { type: string }
              description: attachment; filename=enquiries-2026-10-09.csv
          content:
            text/csv:
              schema: { type: string }
              example: |
                Reference,Date (IST),Type,Status,Products,Variants,Quantity,Displayed total,Lead source,Contact name,Contact phone,Contact email,Assigned to,Follow-up
                GND-ENQ-000123,2026-10-09 15:45,product,New,Neelam Midnight Silk Lehenga Set,M Midnight Blue,1,64500.00,instagram,Asha Example,+91 12345 67890,asha@example.com,,
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/enquiries/bulk:
    post:
      tags: ['Admin: Enquiries']
      operationId: adminBulkEnquiries
      summary: Bulk status change / assignment
      description: '**Permission:** `enquiries.manage`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  maxItems: 200
                  items: { type: integer }
                status: { $ref: '#/components/schemas/EnquiryStatus' }
                assigned_to: { type: [integer, 'null'], description: "User id; null unassigns." }
            example:
              ids: [120, 121]
              status: contacted
      responses:
        '200':
          description: Number updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [updated]
                    properties:
                      updated: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/enquiries/{enquiry}:
    parameters:
      - $ref: '#/components/parameters/EnquiryIdPath'
    get:
      tags: ['Admin: Enquiries']
      operationId: adminGetEnquiry
      summary: Get an enquiry
      description: '**Permission:** `enquiries.view`. Includes contact details, decrypted measurements, history and notes.'
      responses:
        '200':
          description: Enquiry.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AdminEnquiry' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
