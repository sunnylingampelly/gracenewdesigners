openapi: 3.1.0
info:
  title: Grace New Designers API
  version: 1.0.0
  summary: Storefront and admin REST API for the Grace New Designers WhatsApp-commerce platform.
  license:
    name: Proprietary
    url: https://www.example.com/legal/api-license
  contact:
    name: Grace New Designers engineering
    url: https://www.example.com/contact
  description: |
    REST API served by the Laravel 13 backend. The Next.js storefront and admin panel are its only first-party clients.

    ## Versioning
    Every endpoint lives under `/api/v1`. Breaking changes will ship under a new prefix (`/api/v2`); additive
    changes (new fields, new optional parameters) may appear in v1 at any time, so clients must ignore unknown fields.

    ## Storefront vs. admin
    * **Public storefront endpoints** (`/api/v1/*` outside `/api/v1/admin`) are anonymous and read-only, apart from
      enquiry, newsletter and analytics writes. They only ever return published, publicly visible content: drafts,
      scheduled/archived/trashed products, unpublished pages, lookbooks, collections and categories are never exposed
      (an authorized admin can preview drafts with a short-lived `preview_token`). Internal fields such as
      `cost_price`, `internal_notes`, stock quantities, low-stock thresholds, customer data and attribution data are
      never included in public payloads — availability is exposed only as a label (`in_stock`, `low_stock`,
      `made_to_order`, `out_of_stock`).
    * **Admin endpoints** (`/api/v1/admin/**`) use **Laravel Sanctum stateful (cookie) SPA authentication**:
      1. `GET /sanctum/csrf-cookie` — sets the `XSRF-TOKEN` cookie.
      2. `POST /api/v1/admin/auth/login` with header `X-XSRF-TOKEN: <url-decoded XSRF-TOKEN cookie value>`
         (and `Origin`/`Referer` of a stateful domain). On success the `laravel_session` cookie is issued.
      3. Send the session cookie on every subsequent request, plus `X-XSRF-TOKEN` on every state-changing request
         (POST/PUT/PATCH/DELETE). A missing or stale token yields `419 CSRF token mismatch.`
      Every admin route is permission-gated server-side (route `permission:` middleware or model policies); the
      required permission is stated in each operation's description. Users whose role mandates MFA receive
      `403 {"message": "...", "code": "mfa_enrollment_required"}` until they enrol in two-factor authentication.

    ## Rate limits
    | Limiter | Applies to | Limit |
    |---|---|---|
    | `api` | storefront reads, all admin routes | 240 requests/minute per user (admin) or IP |
    | `search` | `/search`, `/search/suggest` | 90 requests/minute per IP |
    | `enquiries` | `POST /enquiries`, `POST /enquiries/{reference}/redirected` | 8/minute **and** 60/hour per IP |
    | `login` | `admin/auth/login`, `admin/auth/two-factor-challenge` | 5/minute per email + IP (and 20/minute per IP) |
    | `forms` | newsletter, unsubscribe, forgot/reset password | 5/minute per IP |
    | `analytics` | `POST /analytics/events` | 120/minute per IP |

    Exceeding a limit returns `429` with `Retry-After` and `X-RateLimit-*` headers.

    ## Errors
    All errors are JSON (`Accept: application/json` is recommended):
    * `422` validation errors: `{"message": "...", "errors": {"field": ["...", "..."]}}` (nested fields use dot
      notation, e.g. `items.0.quantity`).
    * `401`, `403`, `404`, `410`, `419`, `429`: `{"message": "..."}`. 404s never reveal model names or ids
      (`{"message": "Not found."}`); a product that was archived or deleted returns `410` instead of `404`.

    ## WhatsApp hand-off semantics
    The storefront has no cart checkout. `POST /api/v1/enquiries` persists the enquiry intent first and then
    returns `status: "initiated"` together with a pre-filled `https://wa.me/<number>?text=...` URL (or `null` when
    WhatsApp is disabled or no business number is configured). The browser opens that URL. **A redirect to WhatsApp
    is not proof that a message was sent** — the platform only records that a hand-off was started (and, via
    `POST /enquiries/{reference}/redirected`, that the browser navigated). Orders are recorded and confirmed
    manually by staff in the admin.

    ## Conventions
    * Timestamps are ISO-8601 (`2026-10-09T10:15:00+00:00`); dates are `YYYY-MM-DD`.
    * Money in storefront payloads is a JSON number plus a pre-formatted `*_label` (e.g. `₹64,500`). Admin payloads
      return decimal columns as strings with two decimals (e.g. `"64500.00"`).
    * Storefront `url`/`path` fields are storefront-relative paths (`/products/{slug}`); media URLs are absolute.
servers:
  - url: http://localhost:8010
    description: Local development (Laravel)
  - url: https://api.example.com
    description: Production (placeholder)
security:
  - sanctumSession: []
tags:
  - name: 'Storefront: Settings & Content'
    description: Public site settings, navigation, homepage, CMS pages, lookbooks, redirects and sitemap data.
  - name: 'Storefront: Catalog'
    description: Departments, categories, collections and occasions for landing pages.
  - name: 'Storefront: Products'
    description: Product listings with server-side filtering/sorting, facet counts and product detail pages.
  - name: 'Storefront: Search'
    description: Full search results and type-ahead suggestions (rate-limited separately).
  - name: 'Storefront: Enquiries'
    description: WhatsApp enquiry hand-off and shareable enquiry summaries.
  - name: 'Storefront: Engagement'
    description: Newsletter subscription and first-party, consent-gated analytics.
  - name: 'Admin: Auth'
    description: Sanctum cookie-session login, password reset and TOTP two-factor authentication.
  - name: 'Admin: Dashboard'
    description: Dashboard KPIs, reports and shared lookups.
  - name: 'Admin: Products'
    description: Product CRUD, publishing workflow, bulk actions and preview tokens.
  - name: 'Admin: Import/Export'
    description: CSV product export/import with dry runs.
  - name: 'Admin: Taxonomy'
    description: Departments, categories, collections, occasions and tags.
  - name: 'Admin: Attributes & Options'
    description: Size/colour option values, product attributes and size charts.
  - name: 'Admin: Media'
    description: Media library uploads and metadata.
  - name: 'Admin: Enquiries'
    description: Enquiry pipeline management (status, assignment, follow-ups, notes, export).
  - name: 'Admin: Orders'
    description: Manually recorded orders and payments.
  - name: 'Admin: Customers'
    description: Customer contacts, privacy anonymization and newsletter subscribers.
  - name: 'Admin: Homepage'
    description: Draft/publish homepage builder.
  - name: 'Admin: Content'
    description: CMS pages, lookbooks and testimonials.
  - name: 'Admin: Navigation'
    description: Navigation menus.
  - name: 'Admin: SEO'
    description: URL redirects (301/302) and removals (410).
  - name: 'Admin: Settings'
    description: Brand, contact, WhatsApp, social, storefront, SEO, privacy and notification settings.
  - name: 'Admin: Team'
    description: Team members, roles/permissions and the activity log.
x-tagGroups:
  - name: Storefront
    tags:
      - 'Storefront: Settings & Content'
      - 'Storefront: Catalog'
      - 'Storefront: Products'
      - 'Storefront: Search'
      - 'Storefront: Enquiries'
      - 'Storefront: Engagement'
  - name: Admin
    tags:
      - 'Admin: Auth'
      - 'Admin: Dashboard'
      - 'Admin: Products'
      - 'Admin: Import/Export'
      - 'Admin: Taxonomy'
      - 'Admin: Attributes & Options'
      - 'Admin: Media'
      - 'Admin: Enquiries'
      - 'Admin: Orders'
      - 'Admin: Customers'
      - 'Admin: Homepage'
      - 'Admin: Content'
      - 'Admin: Navigation'
      - 'Admin: SEO'
      - 'Admin: Settings'
      - 'Admin: Team'

paths:
  # ============================================================================================
  # Storefront — settings & content
  # ============================================================================================
  /api/v1/settings/public:
    get:
      tags: ['Storefront: Settings & Content']
      operationId: getPublicSettings
      summary: Public site settings
      description: |
        Settings flagged as public (brand, contact, WhatsApp, social, storefront, SEO). Media references
        (`*_media_id`) are expanded into Media objects under the key without the suffix (e.g. `logo_primary`).
        `whatsapp_available` is true when WhatsApp is enabled and a business number is configured.
        Private settings (`whatsapp_closing_line`, retention and notification settings) are never included.
      security: []
      responses:
        '200':
          description: Public settings.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PublicSettings' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/navigation:
    get:
      tags: ['Storefront: Settings & Content']
      operationId: getNavigation
      summary: Navigation menus
      description: |
        All menus keyed by location (e.g. `header`, `footer`). Items pointing at unpublished or deleted targets are
        dropped so the storefront never renders dead links. Cached for 10 minutes.
      security: []
      responses:
        '200':
          description: Menus keyed by location.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: array
                      items: { $ref: '#/components/schemas/NavigationItem' }
              example:
                data:
                  header:
                    - id: 2
                      label: Women
                      url: /shop/women
                      group: null
                      highlight: null
                      external: false
                      image: null
                      children:
                        - id: 4
                          label: Lehengas
                          url: /shop/women/lehengas
                          group: Shop by Category
                          highlight: null
                          external: false
                          image: null
                          children: []
                  footer: []
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/homepage:
    get:
      tags: ['Storefront: Settings & Content']
      operationId: getHomepage
      summary: Live homepage sections
      description: |
        Published, enabled and in-schedule homepage sections in order, each hydrated for rendering (media ids become
        Media objects, product sources become ProductCard arrays, categories/occasions become links). Sections whose
        required content is missing or unpublished are omitted. With a valid `preview_token` (scope `homepage`) the
        current **draft** homepage is returned instead and `meta.preview` is `true`.
      security: []
      parameters:
        - $ref: '#/components/parameters/PreviewToken'
      responses:
        '200':
          description: Homepage sections.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/HomepageSection' }
                  meta: { $ref: '#/components/schemas/PreviewMeta' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/pages:
    get:
      tags: ['Storefront: Settings & Content']
      operationId: listFooterPages
      summary: Footer page links
      description: Published pages flagged `show_in_footer`, ordered by title.
      security: []
      responses:
        '200':
          description: Footer links.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LinkItem' }
              example:
                data:
                  - label: Shipping & Delivery
                    url: /pages/shipping-delivery
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/pages/{slug}:
    get:
      tags: ['Storefront: Settings & Content']
      operationId: getPage
      summary: CMS page
      description: |
        A published CMS page (status `published` and `published_at` not in the future). Drafts are returned only with
        a valid `preview_token` for scope `page:{slug}`. `body` is server-sanitized HTML.
      security: []
      parameters:
        - $ref: '#/components/parameters/SlugPath'
        - $ref: '#/components/parameters/PreviewToken'
      responses:
        '200':
          description: The page.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/CmsPage' }
                  meta: { $ref: '#/components/schemas/PreviewMeta' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/lookbooks:
    get:
      tags: ['Storefront: Settings & Content']
      operationId: listLookbooks
      summary: Published lookbooks
      security: []
      responses:
        '200':
          description: Lookbook summaries.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LookbookSummary' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/lookbooks/{slug}:
    get:
      tags: ['Storefront: Settings & Content']
      operationId: getLookbook
      summary: Lookbook detail
      description: Items link to products/collections only when those targets are publicly visible.
      security: []
      parameters:
        - $ref: '#/components/parameters/SlugPath'
      responses:
        '200':
          description: The lookbook.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Lookbook' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/redirects/resolve:
    get:
      tags: ['Storefront: Settings & Content']
      operationId: resolveRedirect
      summary: Resolve a redirect for a path
      description: |
        Used by the storefront's not-found handling to honour slug changes (301/302) and removals (410).
        Returns `data: null` when no redirect is configured. Increments the redirect's hit counter.
      security: []
      parameters:
        - $ref: '#/components/parameters/PathQuery'
      responses:
        '200':
          description: Redirect target, or null.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    anyOf:
                      - type: object
                        required: [to, status]
                        properties:
                          to:
                            type: [string, 'null']
                            description: Target path or https URL; null for 410 removals.
                          status:
                            type: integer
                            enum: [301, 302, 410]
                      - type: 'null'
              example:
                data:
                  to: /products/neelam-midnight-silk-lehenga-set
                  status: 301
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/path-status:
    get:
      tags: ['Storefront: Settings & Content']
      operationId: getPathStatus
      summary: Lightweight path status for the storefront proxy
      description: |
        * A configured redirect returns `redirect` (with `to` and `code`) or `gone` (410 rule or empty target).
        * `/products/{slug}` paths return `live` (exists and is not archived/trashed — drafts still 404 on the page
          itself), `gone` (archived or trashed) or `missing`.
        * Any other path returns `unknown`.
      security: []
      parameters:
        - $ref: '#/components/parameters/PathQuery'
      responses:
        '200':
          description: Path status.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        enum: [redirect, gone, live, missing, unknown]
                      to:
                        type: string
                        description: Present when status is `redirect`.
                      code:
                        type: integer
                        enum: [301, 302]
                        description: Present when status is `redirect`.
              example:
                data:
                  status: missing
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/sitemap:
    get:
      tags: ['Storefront: Settings & Content']
      operationId: getSitemapEntries
      summary: Sitemap URLs
      description: |
        Paths for the XML sitemap (generated by the storefront): published categories in active departments, visible
        collections, published occasions, indexable live products, indexable published pages and published lookbooks.
      security: []
      responses:
        '200':
          description: Sitemap entries.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [path, updated_at]
                      properties:
                        path: { type: string, examples: [/shop/women/lehengas] }
                        updated_at: { type: [string, 'null'], format: date-time }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ============================================================================================
  # Storefront — catalog
  # ============================================================================================
  /api/v1/departments:
    get:
      tags: ['Storefront: Catalog']
      operationId: listDepartments
      summary: Active departments
      security: []
      responses:
        '200':
          description: Departments ordered by sort order.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [name, slug, url]
                      properties:
                        name: { type: string }
                        slug: { type: string }
                        url: { type: string, examples: [/shop/women] }
                        description: { type: [string, 'null'] }
                        banner: { $ref: '#/components/schemas/NullableMedia' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/departments/{slug}:
    get:
      tags: ['Storefront: Catalog']
      operationId: getDepartment
      summary: Department landing context
      description: Department header data with its visible top-level categories. Inactive departments return 404.
      security: []
      parameters:
        - $ref: '#/components/parameters/SlugPath'
      responses:
        '200':
          description: Listing context (`type` = `department`).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ListingContext' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/categories:
    get:
      tags: ['Storefront: Catalog']
      operationId: listCategoryTree
      summary: Category tree grouped by department
      description: |
        Published categories in active departments, nested by parent. Categories flagged `hide_when_empty` are
        omitted when neither they nor their descendants contain a publicly visible product.
      security: []
      responses:
        '200':
          description: Departments with nested categories.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [name, slug, url, categories]
                      properties:
                        name: { type: string }
                        slug: { type: string }
                        url: { type: string }
                        categories:
                          type: array
                          items: { $ref: '#/components/schemas/CategoryTreeNode' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/categories/{path}:
    get:
      tags: ['Storefront: Catalog']
      operationId: getCategory
      summary: Category landing context
      description: |
        `path` is the full category path including the department slug and may contain `/`
        (route constraint `[a-z0-9\-/]+`), e.g. `women/lehengas` → `GET /api/v1/categories/women/lehengas`.
        Unpublished categories or categories in inactive departments return 404.
      security: []
      parameters:
        - name: path
          in: path
          required: true
          description: Category path, e.g. `women/lehengas`. Slashes are sent unencoded.
          schema:
            type: string
            pattern: '^[a-z0-9\-/]+$'
          example: women/lehengas
      responses:
        '200':
          description: Listing context (`type` = `category`).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ListingContext' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/collections:
    get:
      tags: ['Storefront: Catalog']
      operationId: listCollections
      summary: Visible collections
      description: Published, in-window collections that contain at least one live product; featured first.
      security: []
      responses:
        '200':
          description: Collections.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [name, slug, url, is_featured, product_count]
                      properties:
                        name: { type: string }
                        slug: { type: string }
                        url: { type: string, examples: [/collections/wedding-edit] }
                        tagline: { type: [string, 'null'] }
                        is_featured: { type: boolean }
                        cover: { $ref: '#/components/schemas/NullableMedia' }
                        product_count: { type: integer }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/collections/{slug}:
    get:
      tags: ['Storefront: Catalog']
      operationId: getCollection
      summary: Collection landing context
      security: []
      parameters:
        - $ref: '#/components/parameters/SlugPath'
      responses:
        '200':
          description: Listing context (`type` = `collection`).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ListingContext' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/occasions:
    get:
      tags: ['Storefront: Catalog']
      operationId: listOccasions
      summary: Published occasions
      security: []
      responses:
        '200':
          description: Occasions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [name, slug, url]
                      properties:
                        name: { type: string }
                        slug: { type: string }
                        url: { type: string, examples: [/occasions/reception] }
                        description: { type: [string, 'null'] }
                        image: { $ref: '#/components/schemas/NullableMedia' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/occasions/{slug}:
    get:
      tags: ['Storefront: Catalog']
      operationId: getOccasion
      summary: Occasion landing context
      security: []
      parameters:
        - $ref: '#/components/parameters/SlugPath'
      responses:
        '200':
          description: Listing context (`type` = `occasion`).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ListingContext' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ============================================================================================
  # Storefront — products
  # ============================================================================================
  /api/v1/products:
    get:
      tags: ['Storefront: Products']
      operationId: listProducts
      summary: Product listing
      description: |
        Server-side filtered, sorted and paginated product cards. Only publicly visible products are returned.
        The *context* parameters (`department`, `category`, `collection`, `occasion`, `tag`, `q`, `new`, `featured`,
        `bestseller`) select the page the listing sits on; the remaining parameters refine within it.
        Multi-value filters are comma-separated slugs/codes (e.g. `size=s,m&color=ivory`). Price-on-request
        products sort last for both price sorts.
      security: []
      parameters:
        - $ref: '#/components/parameters/ListingQ'
        - $ref: '#/components/parameters/ListingDepartment'
        - $ref: '#/components/parameters/ListingCategory'
        - $ref: '#/components/parameters/ListingSubcategory'
        - $ref: '#/components/parameters/ListingCollection'
        - $ref: '#/components/parameters/ListingCollections'
        - $ref: '#/components/parameters/ListingOccasion'
        - $ref: '#/components/parameters/ListingOccasions'
        - $ref: '#/components/parameters/ListingTag'
        - $ref: '#/components/parameters/ListingSize'
        - $ref: '#/components/parameters/ListingColor'
        - $ref: '#/components/parameters/ListingAttr'
        - $ref: '#/components/parameters/ListingPriceMin'
        - $ref: '#/components/parameters/ListingPriceMax'
        - $ref: '#/components/parameters/ListingAvailability'
        - $ref: '#/components/parameters/ListingFulfilment'
        - $ref: '#/components/parameters/ListingCustomSize'
        - $ref: '#/components/parameters/ListingNew'
        - $ref: '#/components/parameters/ListingFeatured'
        - $ref: '#/components/parameters/ListingBestseller'
        - $ref: '#/components/parameters/ListingSort'
        - $ref: '#/components/parameters/ListingPage'
        - $ref: '#/components/parameters/ListingPerPage'
      responses:
        '200':
          description: Paginated product cards (Laravel resource collection format).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductCardPage' }
              example:
                data:
                  - id: 1
                    slug: neelam-midnight-silk-lehenga-set
                    name: Neelam Midnight Silk Lehenga Set
                    url: /products/neelam-midnight-silk-lehenga-set
                    category: Lehengas
                    price_mode: fixed
                    price: 64500
                    compare_at_price: 69500
                    currency: INR
                    price_label: '₹64,500'
                    cta_label: Order on WhatsApp
                    badges: [New]
                    image:
                      id: 1
                      kind: image
