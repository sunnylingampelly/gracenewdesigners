  /api/v1/admin/products/imports/{import}/commit:
    parameters:
      - { name: import, in: path, required: true, schema: { type: integer }, description: "Id of a completed dry run." }
    post:
      tags: ['Admin: Import/Export']
      operationId: adminCommitProductImport
      summary: Commit a completed dry run
      description: |
        **Permission:** `products.import`. Re-runs the same file for real as a new queued import. 422
        (`{"message": "Only a completed dry run can be committed."}`) when the import is not a completed dry run.
      responses:
        '202':
          description: Real import queued.
          content:
