  # ============================================================================================
  # Storefront — enquiries
  # ============================================================================================
  /api/v1/enquiries:
    post:
      tags: ['Storefront: Enquiries']
      operationId: createEnquiry
      summary: Start a WhatsApp enquiry
      description: |
        Validates items against the live catalogue, persists the enquiry intent (reference `GND-ENQ-NNNNNN`) and
        builds the standardized WhatsApp message and `wa.me` link.

        * `type=product|bag` requires `items`; `consultation` and `contact` may omit them.
        * Only publicly visible, enquirable products/variants are accepted (out-of-stock variants are rejected with
          422 on `items.N.*`).
        * Contact details (`customer`) and `measurements` are **only stored when `privacy_consent` is accepted**;
          `privacy_consent` becomes required as soon as `customer.phone` or `customer.email` is filled.
        * `measurements` are kept only for custom-size items or consultations, and are stored encrypted.
        * UTM/referrer attribution is stored only when `attribution_consent` is true.
        * `website` is a honeypot and must be absent/empty.
        * The WhatsApp message contains catalogue details and public references only — never contact details,
          measurements or attribution. Bag messages drop trailing items (with a "…and N more" line) to keep the
          encoded URL under 1800 characters; the full list stays on `summary_url`.

        The response `status` is always `"initiated"`: **opening `whatsapp_url` is not proof that a message was
        sent.** `whatsapp_url` is `null` when WhatsApp is disabled or no business number is configured.
        CSRF-exempt; rate limit `enquiries` (8/min and 60/hour per IP).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnquiryRequest' }
            example:
              type: product
              items:
                - product_id: 1
                  variant_id: 2
                  quantity: 1
              customer:
                name: Asha Example
                phone: '+91 12345 67890'
                email: asha@example.com
                city: Pune
                country: India
                message: Is this available for a December wedding?
                marketing_consent: false
              privacy_consent: true
              source_path: /products/neelam-midnight-silk-lehenga-set
              attribution_consent: true
              referrer: https://www.example.com/
              utm:
                source: instagram
                medium: social
                campaign: festive-edit
      responses:
        '201':
          description: Enquiry intent recorded; WhatsApp hand-off initiated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/EnquiryResult' }
              example:
                data:
                  reference: GND-ENQ-000123
                  status: initiated
                  whatsapp_url: https://wa.me/911234567890?text=Hello%20Grace%20New%20Designers%2C%0A%0AI%27m%20interested%20in%20the%20following%20design%3A%0A%0AProduct%3A%20Neelam%20Midnight%20Silk%20Lehenga%20Set%0AReference%3A%20GND-LEH-001%0ASize%3A%20M%0AColor%3A%20Midnight%20Blue%0AQuantity%3A%201%0ADisplayed%20Price%3A%20%E2%82%B964%2C500%0AProduct%20Link%3A%20https%3A%2F%2Fwww.example.com%2Fproducts%2Fneelam-midnight-silk-lehenga-set%0AEnquiry%20Ref%3A%20GND-ENQ-000123%0A%0ACould%20you%20please%20confirm%20availability%2C%20delivery%20details%2C%20and%20how%20to%20place%20the%20order%3F%0A%0AThank%20you.
                  message: |-
                    Hello Grace New Designers,

                    I'm interested in the following design:

                    Product: Neelam Midnight Silk Lehenga Set
                    Reference: GND-LEH-001
                    Size: M
                    Color: Midnight Blue
                    Quantity: 1
                    Displayed Price: ₹64,500
                    Product Link: https://www.example.com/products/neelam-midnight-silk-lehenga-set
                    Enquiry Ref: GND-ENQ-000123

                    Could you please confirm availability, delivery details, and how to place the order?

                    Thank you.
                  summary_url: https://www.example.com/enquiry/Xq7Pz2LmNc4Rt8Vb1Kd6Wy3Hs9Jf5Ga0Ue2Oi4Tp
                  summary_token: Xq7Pz2LmNc4Rt8Vb1Kd6Wy3Hs9Jf5Ga0Ue2Oi4Tp
        '422':
          description: Validation failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                message: Please agree to the privacy notice so we can store your contact details. (and 1 more error)
                errors:
                  privacy_consent:
                    - Please agree to the privacy notice so we can store your contact details.
                  items.0.quantity:
                    - The items.0.quantity field must not be greater than 10.
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/enquiries/{reference}/redirected:
    post:
      tags: ['Storefront: Enquiries']
      operationId: markEnquiryRedirected
      summary: Record that the browser is navigating to WhatsApp
      description: |
        Called by the storefront just before opening `whatsapp_url`. Requires the enquiry's 40-character
        `summary_token` as proof of possession. This records a redirect *initiation* only — it still does not prove
        a message was sent. CSRF-exempt; rate limit `enquiries`.
      security: []
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string }
          example: GND-ENQ-000123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 40
                  maxLength: 40
                  description: The `summary_token` returned by `POST /enquiries`.
            example:
              token: Xq7Pz2LmNc4Rt8Vb1Kd6Wy3Hs9Jf5Ga0Ue2Oi4Tp
      responses:
        '200':
          description: Redirect recorded.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [reference, redirect_initiated]
                    properties:
                      reference: { type: string }
                      redirect_initiated: { type: boolean, const: true }
              example:
                data:
                  reference: GND-ENQ-000123
                  redirect_initiated: true
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/enquiries/summary/{token}:
    get:
      tags: ['Storefront: Enquiries']
      operationId: getEnquirySummary
      summary: Shareable enquiry summary
      description: |
        Catalogue-only summary of an enquiry (used when a bag is too long for a WhatsApp link). Never contains
        customer data. Tokens that are not exactly 40 characters return 404.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 40, maxLength: 40 }
      responses:
        '200':
          description: Enquiry summary.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/EnquirySummary' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ============================================================================================
  # Storefront — engagement
  # ============================================================================================
  /api/v1/newsletter:
    post:
      tags: ['Storefront: Engagement']
      operationId: subscribeNewsletter
      summary: Subscribe to the newsletter
      description: |
        Returns an identical 202 response for new and existing addresses (no address enumeration). Returns 404 when
        the newsletter is disabled in settings. `website` is a honeypot. CSRF-exempt; rate limit `forms` (5/min/IP).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, consent]
              properties:
                email: { type: string, format: email, maxLength: 190 }
                consent:
                  description: Must be accepted (`true`, `1`, `"yes"`, `"on"`).
                  type: [boolean, integer, string]
                source: { type: [string, 'null'], maxLength: 60, description: 'Defaults to `footer`.' }
                website: { type: string, description: "Honeypot — must be absent or empty." }
            example:
              email: reader@example.com
              consent: true
              source: footer
      responses:
        '202':
          description: Subscription accepted.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [subscribed]
                    properties:
                      subscribed: { type: boolean, const: true }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/newsletter/unsubscribe:
    post:
      tags: ['Storefront: Engagement']
      operationId: unsubscribeNewsletter
      summary: Unsubscribe from the newsletter
      description: "Always responds `unsubscribed: true` for a well-formed token (unknown tokens are silently ignored). Rate limit `forms`."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 48, maxLength: 48 }
      responses:
        '200':
          description: Unsubscribed.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [unsubscribed]
                    properties:
                      unsubscribed: { type: boolean, const: true }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/analytics/events:
    post:
      tags: ['Storefront: Engagement']
      operationId: trackAnalyticsEvents
      summary: Record first-party analytics events
      description: |
        Consent-gated, first-party event collection (send only after the visitor consents). Only whitelisted events
        are accepted; only the params `list_name`, `search_term`, `size`, `color`, `results`, `category`, `quantity`
        are stored; `path` is reduced to its path component; `session_id` is hashed with the app key. A `view_item`
        event increments the product's view counter. `whatsapp_enquiry_initiated` is recorded server-side only and
        is rejected here. CSRF-exempt; rate limit `analytics` (120/min/IP).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalyticsEventsRequest' }
            example:
              session_id: 4f9d2c1e-7a3b-4c55-9e10-2b8f6d0a1c33
              events:
                - name: view_item
                  product_id: 1
                  path: /products/neelam-midnight-silk-lehenga-set
                - name: select_size
                  product_id: 1
                  params: { size: m }
      responses:
        '204':
          description: Events stored.
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ============================================================================================
  # Admin — authentication
  # ============================================================================================
  /sanctum/csrf-cookie:
    get:
      tags: ['Admin: Auth']
      operationId: getCsrfCookie
      summary: Initialise CSRF protection (Sanctum)
      description: |
        Provided by Laravel Sanctum (not part of `routes/api.php`). Sets the `XSRF-TOKEN` cookie; send its
        URL-decoded value as the `X-XSRF-TOKEN` header on subsequent state-changing admin requests.
      security: []
      responses:
        '204':
          description: Cookie set (`Set-Cookie XSRF-TOKEN=...`).
          headers:
            Set-Cookie:
              schema: { type: string }
              description: '`XSRF-TOKEN` and session cookies.'

  /api/v1/admin/auth/login:
    post:
      tags: ['Admin: Auth']
      operationId: adminLogin
      summary: Sign in
      description: |
        Public (no session required; obtain the CSRF cookie first). Credentials failures always return the same 422
        on `email` (no account enumeration). If the user has two-factor authentication enabled, the response is
        `{"data": {"two_factor_required": true}}` and the login must be completed within 5 minutes via
        `POST /admin/auth/two-factor-challenge`; otherwise the session is established and the current user returned.
        Rate limit `login`: 5/min per email+IP and 20/min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                remember: { type: [boolean, 'null'] }
            example:
              email: admin@example.com
              password: correct-horse-battery-staple
              remember: true
      responses:
        '200':
          description: Signed in, or a two-factor challenge is required.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    anyOf:
                      - $ref: '#/components/schemas/CurrentUser'
                      - $ref: '#/components/schemas/TwoFactorRequired'
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422':
          description: Invalid credentials or input.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                message: These credentials do not match our records.
                errors:
                  email: [These credentials do not match our records.]
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/auth/two-factor-challenge:
    post:
      tags: ['Admin: Auth']
      operationId: adminTwoFactorChallenge
      summary: Complete sign-in with a TOTP or recovery code
      description: Public. Accepts a 6-digit TOTP code or an unused recovery code. Rate limit `login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 32, description: "TOTP code or recovery code." }
            example:
              code: '123456'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CurrentUser' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/auth/forgot-password:
    post:
      tags: ['Admin: Auth']
      operationId: adminForgotPassword
      summary: Request a password reset link
      description: Public. Same response whether or not the address exists. Rate limit `forms` (5/min/IP).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageData' }
              example:
                data:
                  message: If an account exists for that address, a reset link has been sent.
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/auth/reset-password:
    post:
      tags: ['Admin: Auth']
      operationId: adminResetPassword
      summary: Reset password with an emailed token
      description: |
        Public. Password policy: at least 12 characters with upper- and lower-case letters, numbers and symbols
        (and not found in known breaches, in production). Rate limit `forms`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 12 }
                password_confirmation: { type: string, format: password }
      responses:
        '200':
          description: Password reset.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageData' }
              example:
                data:
                  message: Your password has been reset. You can now sign in.
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/auth/logout:
    post:
      tags: ['Admin: Auth']
      operationId: adminLogout
      summary: Sign out
      description: Requires an authenticated session (no permission). Invalidates the session and regenerates the CSRF token.
      responses:
        '204': { description: "Signed out." }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }

  /api/v1/admin/auth/me:
    get:
      tags: ['Admin: Auth']
      operationId: adminMe
      summary: Current user
      description: Requires an authenticated session (no permission; not blocked by MFA enrolment). Owners receive every permission slug.
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/v1/admin/auth/password:
    put:
      tags: ['Admin: Auth']
      operationId: adminChangePassword
      summary: Change own password
      description: Requires an authenticated session (no permission).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string, format: password }
                password: { type: string, format: password, minLength: 12, description: 'Min 12 chars, mixed case, numbers and symbols.' }
                password_confirmation: { type: string, format: password }
      responses:
        '200':
          description: Password updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageData' }
              example:
                data:
                  message: Password updated.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/admin/auth/two-factor:
    post:
      tags: ['Admin: Auth']
      operationId: adminTwoFactorSetup
      summary: Begin two-factor enrolment
      description: |
        Requires an authenticated session (no permission; reachable before MFA enrolment). Generates a new TOTP
        secret; confirm it with `POST /admin/auth/two-factor/confirm`. 422 if two-factor is already enabled.
      responses:
        '200':
          description: Secret and otpauth URL for the authenticator app.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [secret, otpauth_url]
                    properties:
                      secret: { type: string }
                      otpauth_url: { type: string, examples: ['otpauth://totp/Grace%20New%20Designers:admin%40example.com?secret=ABC...&issuer=Grace%20New%20Designers'] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: ['Admin: Auth']
      operationId: adminTwoFactorDisable
      summary: Disable two-factor authentication
      description: Requires an authenticated session. 422 when the user's role requires two-factor authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties:
                current_password: { type: string, format: password }
      responses:
        '204': { description: "Two-factor disabled." }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/admin/auth/two-factor/confirm:
    post:
      tags: ['Admin: Auth']
      operationId: adminTwoFactorConfirm
      summary: Confirm two-factor enrolment
      description: Requires an authenticated session. Returns 8 single-use recovery codes, shown only once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        '200':
          description: Enabled; recovery codes.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [recovery_codes]
                    properties:
                      recovery_codes:
                        type: array
                        minItems: 8
                        maxItems: 8
                        items: { type: string, examples: [ab3cd-ef9gh] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ============================================================================================
  # Admin — dashboard & lookups
  # ============================================================================================
  /api/v1/admin/dashboard:
    get:
      tags: ['Admin: Dashboard']
      operationId: adminDashboard
      summary: Dashboard KPIs
      description: |
        **Permission:** `reports.view`. Separates *measured* signals (views, enquiry intents — a WhatsApp redirect
        is not a conversation) from *confirmed* outcomes (orders recorded by staff).
      responses:
        '200':
          description: Dashboard data.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Dashboard' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/reports:
    get:
      tags: ['Admin: Dashboard']
      operationId: adminReports
      summary: Enquiry and order reports
      description: '**Permission:** `reports.view`.'
      parameters:
        - name: days
          in: query
          schema: { type: integer, enum: [7, 30, 90, 365], default: 30 }
      responses:
        '200':
          description: Report data.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Reports' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/lookups/statuses:
    get:
      tags: ['Admin: Dashboard']
      operationId: adminStatusLookups
      summary: Order, payment and enquiry status options
      description: '**Permission:** none beyond an authenticated admin session.'
      responses:
        '200':
          description: Status options with labels.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [order, payment, enquiry]
                    properties:
                      order: { type: array, items: { $ref: '#/components/schemas/ValueLabel' } }
                      payment: { type: array, items: { $ref: '#/components/schemas/ValueLabel' } }
                      enquiry: { type: array, items: { $ref: '#/components/schemas/ValueLabel' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/team/assignees:
    get:
      tags: ['Admin: Team']
      operationId: adminListAssignees
      summary: Active team members for assignment dropdowns
      description: '**Permission:** `enquiries.view` or `orders.view`.'
      responses:
        '200':
          description: Active users.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/IdName' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ============================================================================================
  # Admin — products
  # ============================================================================================
  /api/v1/admin/products:
    get:
      tags: ['Admin: Products']
      operationId: adminListProducts
      summary: List products
      description: |
        **Permission:** `products.view`. `q` matches SKU/variant-SKU prefixes and full-text. `status=live` means
        publicly visible; `status=trashed` lists soft-deleted products.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - name: status
          in: query
          schema: { type: string, enum: [draft, scheduled, published, archived, trashed, live] }
        - { name: department_id, in: query, schema: { type: integer } }
        - { name: category_id, in: query, schema: { type: integer } }
        - { name: collection_id, in: query, schema: { type: integer } }
        - { name: stock, in: query, schema: { type: string, enum: [out_of_stock, low_stock] } }
        - { name: flag, in: query, schema: { type: string, enum: [featured, new_arrival, bestseller] } }
        - { name: price_mode, in: query, schema: { $ref: '#/components/schemas/PriceMode' } }
        - name: sort
          in: query
          schema: { type: string, enum: [updated_desc, name, created_desc, price_asc, price_desc, enquiries], default: updated_desc }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - name: ids
          in: query
          description: Comma-separated product ids.
          schema: { type: string, maxLength: 1000, pattern: '^[0-9,]+$' }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Paginated product rows with status counts.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminProductListItem' }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/AdminListMeta'
                      - type: object
                        required: [counts]
                        properties:
                          counts:
                            type: object
                            properties:
                              all: { type: integer }
                              draft: { type: integer }
                              scheduled: { type: integer }
                              published: { type: integer }
                              archived: { type: integer }
                              trashed: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: ['Admin: Products']
      operationId: adminCreateProduct
      summary: Create a product
      description: |
        **Permission:** `products.manage`; additionally `products.publish` when `status` is `published` or
        `scheduled` (the product is created as a draft, then transitioned). `scheduled` requires a future
        `published_at`. Slug is generated from the name when omitted. SKUs are upper-cased; variant SKUs must be
        unique across all products.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminProduct' }
            example:
              name: Neelam Midnight Silk Lehenga Set
              sku: GND-LEH-001
              brand: Grace New Designers
              short_description: A sample piece in raw silk with zardozi detailing.
              description: '<p>Sample listing for development — not a real product.</p>'
              department_id: 1
              status: draft
              price_mode: fixed
              price: 64500
              compare_at_price: 69500
              cost_price: 30000
              currency: INR
              is_new_arrival: true
              allows_custom_size: true
              lead_time_min_days: 21
              lead_time_max_days: 35
              set_includes: Lehenga, blouse and dupatta
              care_instructions: Dry clean only.
              country_of_origin: India
              internal_notes: Sample record for documentation.
              category_ids: [4]
              primary_category_id: 4
              collection_ids: [2]
              occasion_ids: [1, 3]
              tags: [Silk, Embroidered]
              variants:
                - sku: GND-LEH-001-M-MID
                  size_value_id: 3
                  color_value_id: 27
                  stock_quantity: 2
                  stock_policy: track
                  low_stock_threshold: 1
                  is_active: true
              media:
                - media_asset_id: 1
                  role: gallery
                  alt_text: Front view
              attributes:
                - attribute_id: 1
                  value_ids: [3]
      responses:
        '201':
          description: Created product.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AdminProductResource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422':
          description: Validation failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                message: A fixed-price product needs a price (or prices on its variants). (and 2 more errors)
                errors:
                  price: [A fixed-price product needs a price (or prices on its variants).]
                  slug: [Use lowercase letters, numbers and hyphens only.]
                  variants.0.sku: [This SKU is already used by another product.]
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/products/bulk:
    post:
      tags: ['Admin: Products']
      operationId: adminBulkProducts
      summary: Bulk product action
      description: |
        **Permission:** `products.publish` for `publish`, `draft`, `archive`, `delete`, `restore`;
        `products.manage` for `feature`/`unfeature`. Per-product failures (e.g. publishing an incomplete product)
        are reported in `failed` rather than aborting the batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, action]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: integer }
                action:
                  type: string
                  enum: [publish, draft, archive, delete, restore, feature, unfeature]
            example:
              ids: [1, 2, 3]
              action: publish
      responses:
        '200':
          description: Bulk result.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [updated, failed]
                    properties:
                      updated: { type: integer }
                      failed:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            name: { type: string }
                            message: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/products/{product}:
    parameters:
      - $ref: '#/components/parameters/ProductIdPath'
    get:
      tags: ['Admin: Products']
      operationId: adminGetProduct
      summary: Get a product (including trashed)
      description: '**Permission:** `products.view`. Includes internal fields (`cost_price`, `internal_notes`, stock).'
      responses:
        '200':
          description: Product.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AdminProductResource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    patch:
      tags: ['Admin: Products']
      operationId: adminUpdateProduct
      summary: Update a product
      description: |
        **Permission:** `products.manage`; additionally `products.publish` when `status` changes. All fields are
        optional (`sometimes`); array fields (`variants`, `media`, `attributes`, `category_ids`, …) replace the
        existing set when present. Existing variants are matched by `variants.*.id`. Trashed products return 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminProductUpdate' }
            example:
              price: 62000
              is_featured: true
              status: published
      responses:
        '200':
          description: Updated product.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AdminProductResource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: ['Admin: Products']
      operationId: adminDeleteProduct
      summary: Move a product to trash
      description: '**Permission:** `products.publish`. Soft delete — the storefront returns 410 for the product; it can be restored.'
      responses:
        '204': { description: "Trashed." }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/products/{product}/restore:
    parameters:
      - $ref: '#/components/parameters/ProductIdPath'
    post:
      tags: ['Admin: Products']
      operationId: adminRestoreProduct
      summary: Restore a trashed product (as draft)
      description: '**Permission:** `products.publish`. Only trashed products are found (404 otherwise).'
      responses:
        '200':
          description: Restored product (status `draft`).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AdminProductResource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/products/{product}/duplicate:
    parameters:
      - $ref: '#/components/parameters/ProductIdPath'
    post:
      tags: ['Admin: Products']
      operationId: adminDuplicateProduct
      summary: Duplicate a product (as draft)
      description: '**Permission:** `products.manage`.'
      responses:
        '201':
          description: The copy.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AdminProductResource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/products/{product}/status:
    parameters:
      - $ref: '#/components/parameters/ProductIdPath'
    post:
      tags: ['Admin: Products']
      operationId: adminChangeProductStatus
      summary: Change publishing status
      description: |
        **Permission:** `products.publish`. `scheduled` requires a future `published_at`. Publishing validates that
        the product is complete (422 otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/ProductStatus' }
                published_at:
                  type: [string, 'null']
                  format: date-time
                  description: Required (and must be in the future) when status is `scheduled`.
            example:
              status: scheduled
              published_at: '2026-11-01T04:30:00+00:00'
      responses:
        '200':
          description: Updated product.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AdminProductResource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/products/{product}/preview-token:
    parameters:
      - $ref: '#/components/parameters/ProductIdPath'
    get:
      tags: ['Admin: Products']
      operationId: adminProductPreviewToken
      summary: Issue a storefront preview token
      description: |
        **Permission:** `products.view`. Returns a 60-minute HMAC token (scope `product:{slug}`) to pass as
        `?preview_token=` to `GET /api/v1/products/{slug}`.
      responses:
        '200':
          description: Token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewTokenResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ============================================================================================
  # Admin — import / export
  # ============================================================================================
  /api/v1/admin/products/export:
    get:
      tags: ['Admin: Import/Export']
      operationId: adminExportProducts
      summary: Export products as CSV
      description: |
        **Permission:** `products.import`. Streams a UTF-8 CSV (with BOM), one row per variant, using the import
        column layout. Values beginning with `= + - @` are prefixed with `'` to prevent formula injection.
      parameters:
        - name: ids[]
          in: query
          description: Optional product ids to export (all products when omitted).
          style: form
          explode: true
          schema:
            type: array
            items: { type: integer }
      responses:
        '200':
          description: CSV file (`products-YYYY-MM-DD-His.csv`).
          headers:
            Content-Disposition:
              schema: { type: string }
              description: attachment; filename=products-2026-10-09-101500.csv
          content:
            text/csv:
              schema: { type: string }
              example: |
                sku,name,slug,status,department,categories,primary_category,collections,occasions,tags,price_mode,price,compare_at_price,currency,short_description,description,is_featured,is_new_arrival,is_bestseller,is_exclusive,allows_custom_size,is_made_to_order,lead_time_min_days,lead_time_max_days,set_includes,craftsmanship,care_instructions,delivery_notes,fabric,work_type,seo_title,seo_description,variant_sku,size,color,variant_price,stock_quantity,stock_policy
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

