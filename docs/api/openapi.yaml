        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ============================================================================================
  # Admin — settings
  # ============================================================================================
  /api/v1/admin/settings:
    get:
      tags: ['Admin: Settings']
      operationId: adminGetSettings
      summary: All settings grouped
      description: '**Permission:** `settings.manage` or `seo.manage`. Includes private settings.'
      responses:
        '200':
          description: Settings by group.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SettingGroups' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    patch:
      tags: ['Admin: Settings']
      operationId: adminUpdateSettings
      summary: Update settings (partial)
      description: |
        **Permission:** `settings.manage`. Send a flat object of setting keys; only keys present are validated and
        saved (unknown keys are ignored). Changes are written to the activity log. Returns all settings grouped.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsUpdate' }
            example:
              whatsapp_business_number: '+911234567890'
              whatsapp_enabled: true
              site_url: https://www.example.com
              announcement_enabled: true
              announcement_text: Festive edit now live.
      responses:
        '200':
          description: Settings by group.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SettingGroups' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422':
          description: Validation failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                message: Enter the number in international format, e.g. +919876543210 (country code, no spaces).
                errors:
                  whatsapp_business_number:
                    - Enter the number in international format, e.g. +919876543210 (country code, no spaces).
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ============================================================================================
  # Admin — team
  # ============================================================================================
  /api/v1/admin/users:
    get:
      tags: ['Admin: Team']
      operationId: adminListUsers
      summary: List team members
      description: '**Permission:** `users.manage`.'
      responses:
        '200':
          description: Users.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TeamUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: ['Admin: Team']
      operationId: adminCreateUser
      summary: Add a team member
      description: |
        **Permission:** `users.manage`. Only an owner can grant the Owner role. A password-reset invite is emailed
        unless `send_invite` is false and a password is supplied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role_ids]
              properties:
                name: { type: string, maxLength: 150 }
                email: { type: string, format: email, maxLength: 190 }
                phone: { type: [string, 'null'], maxLength: 32 }
                role_ids:
                  type: array
                  minItems: 1
                  items: { type: integer }
                password: { type: [string, 'null'], format: password, minLength: 12 }
                send_invite: { type: boolean, default: true }
            example:
              name: Team Member
              email: team.member@example.com
              role_ids: [4]
      responses:
        '201':
          description: Created user (model with roles).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/UserModel' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/users/{user}:
    parameters:
      - { name: user, in: path, required: true, schema: { type: integer }, description: "User id." }
    patch:
      tags: ['Admin: Team']
      operationId: adminUpdateUser
      summary: Update a team member
      description: |
        **Permission:** `users.manage`; only owners may modify owners. You cannot deactivate yourself or change your
        own roles, and at least one active owner must remain (422). Deactivation ends the user's sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 150 }
                email: { type: string, format: email, maxLength: 190 }
                phone: { type: [string, 'null'], maxLength: 32 }
                is_active: { type: boolean }
                role_ids:
                  type: array
                  minItems: 1
                  items: { type: integer }
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/UserModel' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: ['Admin: Team']
      operationId: adminDeleteUser
      summary: Remove a team member
      description: '**Permission:** `users.manage`; cannot delete yourself; only owners may remove owners; the last active owner cannot be removed.'
      responses:
        '204': { description: "Removed." }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/roles:
    get:
      tags: ['Admin: Team']
      operationId: adminListRoles
      summary: List roles and the permission catalogue
      description: '**Permission:** `users.manage`.'
      responses:
        '200':
          description: Roles.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RolesResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/roles/{role}:
    parameters:
      - { name: role, in: path, required: true, schema: { type: integer }, description: "Role id." }
    patch:
      tags: ['Admin: Team']
      operationId: adminUpdateRole
      summary: Update a role's permissions / MFA requirement
      description: |
        **Permission:** caller must hold the **Owner** role (403 otherwise). The Owner role's permissions cannot be
        changed (422). Returns all roles (same as GET).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                permissions:
                  type: array
                  items: { $ref: '#/components/schemas/PermissionSlug' }
                requires_mfa: { type: boolean }
                description: { type: [string, 'null'], maxLength: 255 }
      responses:
        '200':
          description: Roles.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RolesResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/activity-logs:
    get:
      tags: ['Admin: Team']
      operationId: adminListActivity
      summary: Activity log
      description: '**Permission:** `activity.view`. 50 per page, newest first.'
      parameters:
        - { name: user_id, in: query, schema: { type: integer } }
        - { name: subject_type, in: query, schema: { type: string, maxLength: 60, examples: [Product] } }
        - { name: action, in: query, description: "Action prefix, e.g. `product.`.", schema: { type: string, maxLength: 60 } }
        - { name: q, in: query, description: "Description contains.", schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Log entries.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        action: { type: string, examples: [product.deleted] }
                        description: { type: string }
                        subject_type: { type: [string, 'null'] }
                        subject_id: { type: [integer, 'null'] }
                        changes: { type: [object, array, 'null'] }
                        user: { type: string, description: "User name or `System`." }
                        created_at: { type: [string, 'null'], format: date-time }
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer }
                      last_page: { type: integer }
                      total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  securitySchemes:
    sanctumSession:
      type: apiKey
      in: cookie
      name: laravel_session
      description: |
        Laravel Sanctum stateful SPA session cookie, issued by `POST /api/v1/admin/auth/login`.
        Call `GET /sanctum/csrf-cookie` first and send the URL-decoded `XSRF-TOKEN` cookie value in the
        `X-XSRF-TOKEN` header on every state-changing request (otherwise `419 CSRF token mismatch.`).
        Requests must come from a configured stateful domain (Origin/Referer).

  parameters:
    PreviewToken:
      name: preview_token
      in: query
      required: false
      description: Short-lived (60 min) HMAC preview token issued by an admin preview-token endpoint. Invalid or expired tokens are ignored (public content is served).
      schema: { type: string }
    SlugPath:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
      example: neelam-midnight-silk-lehenga-set
    PathQuery:
      name: path
      in: query
      required: false
      description: Storefront path to check (normalized server-side). Defaults to `/`.
      schema: { type: string, default: / }
      example: /products/old-slug
    ProductIdPath:
      name: product
      in: path
      required: true
      description: Product id (numeric).
      schema: { type: integer }
    EnquiryIdPath:
      name: enquiry
      in: path
      required: true
      description: Enquiry id (numeric).
      schema: { type: integer }
    SectionIdPath:
      name: section
      in: path
      required: true
      description: Homepage section id.
      schema: { type: integer }
    TestimonialIdPath:
      name: testimonial
      in: path
      required: true
      description: Testimonial id.
      schema: { type: integer }
    ListingQ:
      name: q
      in: query
      description: Search term (context).
      schema: { type: string, maxLength: 100 }
    ListingDepartment:
      name: department
      in: query
      description: Department slug (context). Matches products in the department directly or via any of its categories.
      schema: { type: string, maxLength: 120, pattern: '^[A-Za-z0-9_\-]+$' }
    ListingCategory:
      name: category
      in: query
      description: Category path (context), including descendants.
      schema: { type: string, maxLength: 400, pattern: '^[a-z0-9\-/]+$' }
      example: women/lehengas
    ListingSubcategory:
      name: subcategory
      in: query
      description: Comma-separated category paths to refine by.
      schema: { $ref: '#/components/schemas/SlugList' }
    ListingCollection:
      name: collection
      in: query
      description: Collection slug (context).
      schema: { type: string, maxLength: 150, pattern: '^[A-Za-z0-9_\-]+$' }
    ListingCollections:
      name: collections
      in: query
      description: Comma-separated collection slugs (refinement).
      schema: { $ref: '#/components/schemas/SlugList' }
    ListingOccasion:
      name: occasion
      in: query
      description: Occasion slug (context).
      schema: { type: string, maxLength: 120, pattern: '^[A-Za-z0-9_\-]+$' }
    ListingOccasions:
      name: occasions
      in: query
      description: Comma-separated occasion slugs (refinement).
      schema: { $ref: '#/components/schemas/SlugList' }
    ListingTag:
      name: tag
      in: query
      description: Tag slug (context).
      schema: { type: string, maxLength: 100, pattern: '^[A-Za-z0-9_\-]+$' }
    ListingSize:
      name: size
      in: query
      description: Comma-separated size codes.
      schema: { $ref: '#/components/schemas/SlugList' }
      example: s,m
    ListingColor:
      name: color
      in: query
      description: Comma-separated colour codes.
      schema: { $ref: '#/components/schemas/SlugList' }
      example: ivory,midnight-blue
    ListingAttr:
      name: attr
      in: query
      description: Filterable attribute values keyed by attribute code, e.g. `attr[fabric]=raw-silk,organza` (max 10 attributes).
      style: deepObject
      explode: true
      schema:
        type: object
        maxProperties: 10
        additionalProperties: { $ref: '#/components/schemas/SlugList' }
    ListingPriceMin:
      name: price_min
      in: query
      schema: { type: number, minimum: 0 }
    ListingPriceMax:
      name: price_max
      in: query
      schema: { type: number, minimum: 0 }
    ListingAvailability:
      name: availability
      in: query
      description: '`available` keeps only products with an enquirable variant.'
      schema: { type: string, enum: [available] }
    ListingFulfilment:
      name: fulfilment
      in: query
      schema: { type: string, enum: [made_to_order, ready_to_ship] }
    ListingCustomSize:
      name: custom_size
      in: query
      description: Only products that allow custom sizing.
      schema: { type: boolean }
    ListingNew:
      name: new
      in: query
      description: New arrivals only (context).
      schema: { type: boolean }
    ListingFeatured:
      name: featured
      in: query
      description: Featured only (context).
      schema: { type: boolean }
    ListingBestseller:
      name: bestseller
      in: query
      description: Bestsellers only (context).
      schema: { type: boolean }
    ListingSort:
      name: sort
      in: query
      schema:
        type: string
        enum: [recommended, newest, price_asc, price_desc, popular, alphabetical]
        default: recommended
    ListingPage:
      name: page
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000 }
    ListingPerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 48, default: 24 }
    EnquiryQ:
      name: q
      in: query
      description: Reference, contact name/phone/email, product name or SKU prefix.
      schema: { type: string, maxLength: 100 }
    EnquiryStatusFilter:
      name: status
      in: query
      description: '`open` (new, contacted, awaiting_response, qualified) or a comma-separated list of enquiry statuses.'
      schema: { type: string }
      example: new,contacted
    EnquiryTypeFilter:
      name: type
      in: query
      schema: { $ref: '#/components/schemas/EnquiryType' }
    EnquiryAssignedTo:
      name: assigned_to
      in: query
      description: User id, or `unassigned`.
      schema: { type: string }
    EnquiryFollowUp:
      name: follow_up
      in: query
      schema: { type: string, enum: [overdue, today, upcoming] }
    EnquiryFrom:
      name: from
      in: query
      description: Created on/after this date.
      schema: { type: string, format: date }
    EnquiryTo:
      name: to
      in: query
      description: Created on/before this date (inclusive).
      schema: { type: string, format: date }
    EnquiryProductId:
      name: product_id
      in: query
      schema: { type: integer }
    EnquirySource:
      name: source
      in: query
      description: Exact `utm_source`.
      schema: { type: string, maxLength: 100 }

  responses:
    ValidationError:
      description: Validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
          example:
            message: The q field must be at least 2 characters.
            errors:
              q: [The q field must be at least 2 characters.]
    Unauthenticated:
      description: No valid session.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Unauthenticated. }
    Forbidden:
      description: Missing permission, or MFA enrolment required for the user's role (`code` = `mfa_enrollment_required`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: You do not have permission to perform this action. }
    NotFound:
      description: Not found (never reveals model names or ids).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Not found. }
    Gone:
      description: The resource was archived or deleted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: This design is no longer available. }
    CsrfMismatch:
      description: Missing or stale `X-XSRF-TOKEN` header (session/CSRF expired).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: CSRF token mismatch. }
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds until the limit resets.
          schema: { type: integer }
        X-RateLimit-Limit:
          schema: { type: integer }
        X-RateLimit-Remaining:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Too Many Attempts. }

  schemas:
    # ------------------------------------------------------------------ common
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        code:
          type: string
          description: Machine-readable code, e.g. `mfa_enrollment_required`.
    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message: { type: string, description: "First error message, with \"(and N more errors)\" when there are several." }
        errors:
          type: object
          description: Field (dot notation) → list of messages.
          additionalProperties:
            type: array
            items: { type: string }
      example:
        message: The type field is required. (and 1 more error)
        errors:
          type: [The type field is required.]
          customer.email: [The customer.email field must be a valid email address.]
    MessageData:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [message]
          properties:
            message: { type: string }
    SlugList:
      type: string
      maxLength: 500
      pattern: '^[a-z0-9\-/,]*$'
      description: Comma-separated lowercase slugs/codes.
    ValueLabel:
      type: object
      required: [value, label]
      properties:
        value: { type: string }
        label: { type: string }
    IdName:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    LinkItem:
      type: object
      required: [label, url]
      properties:
        label: { type: string }
        url: { type: string }
    PreviewMeta:
      type: object
      required: [preview]
      properties:
        preview: { type: boolean, description: "True when draft content was served via a valid preview token." }
    PreviewTokenResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [token, path]
          properties:
            token: { type: string, description: 'Append as `?preview_token=` on the storefront.' }
            path: { type: string, examples: [/products/neelam-midnight-silk-lehenga-set] }
    Seo:
      type: object
      required: [title, canonical_url]
      properties:
        title: { type: string }
        description: { type: [string, 'null'] }
        canonical_url: { type: string }
        og_image: { type: [string, 'null'] }
        indexable: { type: boolean }
    Breadcrumb:
      type: object
      required: [name, path]
      properties:
        name: { type: string }
        path: { type: string, description: "Department slug or category path." }
    PaginationLinks:
      type: object
      required: [first, last, prev, next]
      properties:
        first: { type: [string, 'null'] }
        last: { type: [string, 'null'] }
        prev: { type: [string, 'null'] }
        next: { type: [string, 'null'] }
    PaginatedMeta:
      type: object
      description: Laravel length-aware paginator metadata.
      required: [current_page, last_page, per_page, total, path]
      properties:
        current_page: { type: integer }
        from: { type: [integer, 'null'] }
        last_page: { type: integer }
        links:
          type: array
          items:
            type: object
            properties:
              url: { type: [string, 'null'] }
              label: { type: string }
              page: { type: [integer, 'null'] }
              active: { type: boolean }
        path: { type: string }
        per_page: { type: integer }
        to: { type: [integer, 'null'] }
        total: { type: integer }
    AdminListMeta:
      type: object
      required: [current_page, last_page, per_page, total]
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    # ------------------------------------------------------------------ enums
    PriceMode:
      type: string
      enum: [fixed, starting_from, on_request]
      description: '`on_request` products never expose a price publicly.'
    ProductStatus:
      type: string
      enum: [draft, scheduled, published, archived]
    Availability:
      type: string
      enum: [in_stock, low_stock, made_to_order, out_of_stock]
    StockPolicy:
      type: string
      enum: [track, made_to_order, untracked]
    MediaKind:
      type: string
      enum: [image, video, document]
    EnquiryType:
      type: string
      enum: [product, bag, consultation, contact]
    EnquiryStatus:
      type: string
      enum: [new, contacted, awaiting_response, qualified, order_confirmed, completed, lost, spam]
    OrderStatus:
      type: string
      enum: [pending_confirmation, confirmed, in_production, ready, dispatched, delivered, cancelled]
    PaymentStatus:
      type: string
      enum: [unpaid, partially_paid, paid, refunded]
      description: Recorded manually by staff; the platform never infers payment.
    SectionType:
      type: string
      enum: [hero_image, hero_video, split_editorial, category_grid, collection_feature, featured_products, occasion_grid, lookbook_gallery, text_image, brand_story, craftsmanship, testimonials, newsletter, appointment_cta, social_gallery]
    PermissionSlug:
      type: string
      enum: [products.view, products.manage, products.publish, products.import, taxonomy.manage, attributes.manage, media.view, media.manage, enquiries.view, enquiries.manage, enquiries.export, orders.view, orders.manage, customers.view, customers.manage, content.manage, navigation.manage, seo.manage, reports.view, settings.manage, users.manage, activity.view]

    # ------------------------------------------------------------------ media
    Media:
      type: object
      description: Public media representation with responsive renditions.
      required: [id, kind, url, alt, sources]
      properties:
        id: { type: integer }
        kind: { $ref: '#/components/schemas/MediaKind' }
        url: { type: string, format: uri }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        alt: { type: string }
        mime_type: { type: [string, 'null'] }
        focal_point:
          anyOf:
            - type: object
              required: [x, y]
              properties:
                x: { type: number, minimum: 0, maximum: 1 }
                y: { type: number, minimum: 0, maximum: 1 }
            - type: 'null'
        sources:
          type: array
          items:
            type: object
            required: [name, url]
            properties:
              name: { type: string, examples: [thumb, sm, md, lg] }
              url: { type: string, format: uri }
              width: { type: [integer, 'null'] }
              height: { type: [integer, 'null'] }
              format: { type: [string, 'null'], examples: [webp] }
    NullableMedia:
      anyOf:
        - $ref: '#/components/schemas/Media'
        - type: 'null'
    MediaAsset:
      type: object
      description: Admin media library asset.
      required: [id, kind, url]
      properties:
        id: { type: integer }
        kind: { $ref: '#/components/schemas/MediaKind' }
        original_name: { type: [string, 'null'] }
        mime_type: { type: [string, 'null'] }
        size_bytes: { type: [integer, 'null'] }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        alt_text: { type: [string, 'null'] }
        title: { type: [string, 'null'] }
        folder: { type: [string, 'null'] }
        url: { type: string, format: uri }
        thumb_url: { type: [string, 'null'] }
        preview_url: { type: [string, 'null'] }
        processing_status: { type: [string, 'null'], examples: [pending, completed, failed] }
        processing_error: { type: [string, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }

    # ------------------------------------------------------------------ settings
    PublicSettings:
      type: object
      properties:
        brand_name: { type: string }
        tagline: { type: [string, 'null'] }
        brand_description: { type: [string, 'null'] }
        brand_colors: { $ref: '#/components/schemas/BrandColors' }
        contact_email: { type: [string, 'null'] }
        contact_phone: { type: [string, 'null'] }
        address: { type: [string, 'null'] }
        business_hours: { type: [string, 'null'] }
        map_url: { type: [string, 'null'] }
        whatsapp_business_number: { type: [string, 'null'], examples: ['+911234567890'] }
        whatsapp_enabled: { type: boolean }
        social_instagram: { type: [string, 'null'] }
        social_facebook: { type: [string, 'null'] }
        social_pinterest: { type: [string, 'null'] }
        social_youtube: { type: [string, 'null'] }
        social_x: { type: [string, 'null'] }
        site_url: { type: [string, 'null'] }
        currency: { type: string, examples: [INR] }
        timezone: { type: string, examples: [Asia/Kolkata] }
        announcement_enabled: { type: boolean }
        announcement_text: { type: [string, 'null'] }
        announcement_link: { type: [string, 'null'] }
        newsletter_enabled: { type: boolean }
        consultation_enabled: { type: boolean }
        shipping_note: { type: [string, 'null'] }
        seo_title_suffix: { type: [string, 'null'] }
        seo_default_description: { type: [string, 'null'] }
        google_site_verification: { type: [string, 'null'] }
        ga4_measurement_id: { type: [string, 'null'] }
        logo_primary: { $ref: '#/components/schemas/NullableMedia' }
        logo_dark_bg: { $ref: '#/components/schemas/NullableMedia' }
        logo_light_bg: { $ref: '#/components/schemas/NullableMedia' }
        logo_mobile: { $ref: '#/components/schemas/NullableMedia' }
        favicon: { $ref: '#/components/schemas/NullableMedia' }
        social_share: { $ref: '#/components/schemas/NullableMedia' }
        whatsapp_available: { type: boolean, description: "whatsapp_enabled AND a business number is configured." }
      example:
        brand_name: Grace New Designers
        tagline: Modern Indian Couture, Timeless Grace.
        brand_description: null
        brand_colors: null
        contact_email: hello@example.com
        contact_phone: null
        address: null
        business_hours: null
        map_url: null
        whatsapp_business_number: '+911234567890'
        whatsapp_enabled: true
        social_instagram: null
        social_facebook: null
        social_pinterest: null
        social_youtube: null
        social_x: null
        site_url: https://www.example.com
        currency: INR
        timezone: Asia/Kolkata
        announcement_enabled: false
        announcement_text: null
        announcement_link: null
        newsletter_enabled: true
        consultation_enabled: true
        shipping_note: null
        seo_title_suffix: Grace New Designers
        seo_default_description: Modern Indian couture — bridal, occasionwear and ethnic luxury by Grace New Designers.
        google_site_verification: null
        ga4_measurement_id: null
        logo_primary: null
        logo_dark_bg: null
        logo_light_bg: null
        logo_mobile: null
        favicon: null
        social_share: null
        whatsapp_available: true
    BrandColors:
      description: Brand colour tokens (`#RRGGBB` values), as a name→hex map or a list.
      anyOf:
        - type: object
          additionalProperties: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$' }
        - type: array
          items: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$' }
        - type: 'null'
    SettingGroups:
      type: object
      description: All settings (public and private) grouped by admin tab. Media settings are returned as asset ids.
      properties:
        brand:
          type: object
          properties:
            brand_name: { type: string }
            tagline: { type: [string, 'null'] }
            brand_description: { type: [string, 'null'] }
            logo_primary_media_id: { type: [integer, 'null'] }
            logo_dark_bg_media_id: { type: [integer, 'null'] }
            logo_light_bg_media_id: { type: [integer, 'null'] }
            logo_mobile_media_id: { type: [integer, 'null'] }
            favicon_media_id: { type: [integer, 'null'] }
            social_share_media_id: { type: [integer, 'null'] }
            brand_colors: { $ref: '#/components/schemas/BrandColors' }
        contact:
          type: object
          properties:
            contact_email: { type: [string, 'null'] }
            contact_phone: { type: [string, 'null'] }
            address: { type: [string, 'null'] }
            business_hours: { type: [string, 'null'] }
            map_url: { type: [string, 'null'] }
        whatsapp:
          type: object
          properties:
            whatsapp_business_number: { type: [string, 'null'] }
            whatsapp_enabled: { type: boolean }
            whatsapp_closing_line: { type: [string, 'null'], description: "Private. Closing line of product/bag WhatsApp messages." }
        social:
          type: object
          properties:
            social_instagram: { type: [string, 'null'] }
            social_facebook: { type: [string, 'null'] }
            social_pinterest: { type: [string, 'null'] }
            social_youtube: { type: [string, 'null'] }
            social_x: { type: [string, 'null'] }
        store:
          type: object
          properties:
            site_url: { type: [string, 'null'] }
            currency: { type: string }
            timezone: { type: string }
            announcement_enabled: { type: boolean }
            announcement_text: { type: [string, 'null'] }
            announcement_link: { type: [string, 'null'] }
            newsletter_enabled: { type: boolean }
            consultation_enabled: { type: boolean }
            shipping_note: { type: [string, 'null'] }
        seo:
          type: object
          properties:
            seo_title_suffix: { type: [string, 'null'] }
            seo_default_description: { type: [string, 'null'] }
            google_site_verification: { type: [string, 'null'] }
            ga4_measurement_id: { type: [string, 'null'] }
        privacy:
          type: object
          properties:
            enquiry_retention_months: { type: integer }
            analytics_retention_days: { type: integer }
        notifications:
          type: object
          properties:
            notify_new_enquiry_email: { type: [string, 'null'] }
            notify_low_stock: { type: boolean }
    SettingsUpdate:
      type: object
      description: Flat partial update; rules apply only to keys present. Keys marked "required" must not be empty when sent.
      properties:
        brand_name: { type: string, maxLength: 120, description: "Required (non-empty) when present." }
        tagline: { type: [string, 'null'], maxLength: 160 }
        brand_description: { type: [string, 'null'], maxLength: 2000 }
        logo_primary_media_id: { type: [integer, 'null'], description: "Existing media asset id." }
        logo_dark_bg_media_id: { type: [integer, 'null'] }
        logo_light_bg_media_id: { type: [integer, 'null'] }
        logo_mobile_media_id: { type: [integer, 'null'] }
        favicon_media_id: { type: [integer, 'null'] }
        social_share_media_id: { type: [integer, 'null'] }
        brand_colors: { $ref: '#/components/schemas/BrandColors' }
        contact_email: { type: [string, 'null'], format: email, maxLength: 190 }
        contact_phone: { type: [string, 'null'], maxLength: 40 }
        address: { type: [string, 'null'], maxLength: 500 }
        business_hours: { type: [string, 'null'], maxLength: 300 }
        map_url: { type: [string, 'null'], format: uri, maxLength: 500 }
        whatsapp_business_number: { type: [string, 'null'], pattern: '^\+[1-9]\d{7,14}$', description: 'International format without spaces, e.g. +911234567890.' }
        whatsapp_enabled: { type: boolean }
        whatsapp_closing_line: { type: [string, 'null'], maxLength: 300 }
        social_instagram: { type: [string, 'null'], format: uri, maxLength: 300 }
        social_facebook: { type: [string, 'null'], format: uri, maxLength: 300 }
        social_pinterest: { type: [string, 'null'], format: uri, maxLength: 300 }
        social_youtube: { type: [string, 'null'], format: uri, maxLength: 300 }
        social_x: { type: [string, 'null'], format: uri, maxLength: 300 }
        site_url: { type: [string, 'null'], format: uri, maxLength: 300 }
        currency: { type: string, minLength: 3, maxLength: 3, description: "Required when present." }
        timezone: { type: string, description: "Valid IANA timezone; required when present." }
        announcement_enabled: { type: boolean }
        announcement_text: { type: [string, 'null'], maxLength: 200 }
        announcement_link: { type: [string, 'null'], maxLength: 300 }
        newsletter_enabled: { type: boolean }
        consultation_enabled: { type: boolean }
        shipping_note: { type: [string, 'null'], maxLength: 1000 }
        seo_title_suffix: { type: [string, 'null'], maxLength: 80 }
        seo_default_description: { type: [string, 'null'], maxLength: 300 }
        google_site_verification: { type: [string, 'null'], maxLength: 120 }
        ga4_measurement_id: { type: [string, 'null'], pattern: '^G-[A-Z0-9]{4,20}$' }
        enquiry_retention_months: { type: integer, minimum: 1, maximum: 120 }
        analytics_retention_days: { type: integer, minimum: 7, maximum: 1095 }
        notify_new_enquiry_email: { type: [string, 'null'], format: email }
        notify_low_stock: { type: boolean }

    # ------------------------------------------------------------------ navigation & content
    NavigationItem:
      type: object
      required: [id, label, url, external, children]
      properties:
        id: { type: integer }
        label: { type: string }
        url: { type: [string, 'null'], description: "Resolved storefront path or external URL; null for pure grouping parents." }
        group: { type: [string, 'null'], description: "Mega-menu column heading." }
        highlight: { type: [string, 'null'], description: "Highlight badge text." }
        external: { type: boolean, description: "Open in a new tab." }
        image: { $ref: '#/components/schemas/NullableMedia' }
        children:
          type: array
          items: { $ref: '#/components/schemas/NavigationItem' }
    NavigationItemInput:
      type: object
      required: [label, link_type]
      properties:
        id: { type: [integer, 'null'], description: "Existing item id to update." }
        label: { type: string, maxLength: 120 }
        link_type: { type: string, enum: [url, department, category, collection, occasion, page, lookbook, route] }
        link_id: { type: [integer, 'null'], description: "Target id; required for typed links." }
        url:
          type: [string, 'null']
          maxLength: 500
          description: 'For `url`: `/path`, `https://…`, `mailto:` or `tel:`. For `route`: one of home, shop, new-arrivals, collections, occasions, lookbook, wishlist, bag, contact, consultation, search.'
        group_heading: { type: [string, 'null'], maxLength: 120 }
        image_media_id: { type: [integer, 'null'] }
        highlight_text: { type: [string, 'null'], maxLength: 120 }
        open_in_new_tab: { type: boolean }
        is_active: { type: boolean }
        children:
          type: array
          maxItems: 40
          description: Nested items (max 3 levels in total).
          items: { $ref: '#/components/schemas/NavigationItemInput' }
    AdminNavigationItem:
      type: object
      properties:
        id: { type: integer }
        label: { type: string }
        link_type: { type: string }
        link_id: { type: [integer, 'null'] }
        url: { type: [string, 'null'] }
        group_heading: { type: [string, 'null'] }
        image_media_id: { type: [integer, 'null'] }
        highlight_text: { type: [string, 'null'] }
        open_in_new_tab: { type: boolean }
        is_active: { type: boolean }
        children:
          type: array
          items: { $ref: '#/components/schemas/AdminNavigationItem' }
    AdminMenusResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              location: { type: string, examples: [header, footer] }
              items:
                type: array
                items: { $ref: '#/components/schemas/AdminNavigationItem' }
        meta:
          type: object
          properties:
            link_types:
              type: array
              items: { type: string }
            routes:
              type: array
              items: { type: string }
    HomepageSection:
      type: object
      description: |
        Storefront (hydrated) homepage section. `data` is the section config for its `type` with references
        resolved: `*_media_id` keys become Media objects under the key without `_id` (e.g. `desktop_media`);
        `featured_products` gains `products` (ProductCard[]); `category_grid`, `occasion_grid`, `lookbook_gallery`
        and `social_gallery` gain `items` with `label`/`url`/`media`; `testimonials` gains approved `items`
        (`quote`, `author`, `location`, `occasion`, `media`); `craftsmanship` pillars gain `media`.
      required: [id, type, data]
      properties:
        id: { type: integer }
        type: { $ref: '#/components/schemas/SectionType' }
        data:
          type: object
          additionalProperties: true
    AdminHomepageSection:
      type: object
      required: [id, type, name, config, is_enabled]
      properties:
        id: { type: integer }
        type: { $ref: '#/components/schemas/SectionType' }
        type_label: { type: string }
        name: { type: string }
        config: { $ref: '#/components/schemas/SectionConfig' }
        is_enabled: { type: boolean, description: "Draft enabled state." }
        sort_order: { type: integer, description: "Draft order." }
        is_published: { type: boolean }
        live_is_enabled: { type: [boolean, 'null'] }
        pending_removal: { type: boolean }
        has_unpublished_changes: { type: boolean }
        starts_at: { type: [string, 'null'], format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        published_at: { type: [string, 'null'], format: date-time }
        updated_by: { type: [string, 'null'] }
        updated_at: { type: [string, 'null'], format: date-time }
    SectionConfig:
      description: Draft config; validated against the schema for the section's type. Plain text only (HTML stripped).
      anyOf:
        - $ref: '#/components/schemas/SectionConfigHero'
        - $ref: '#/components/schemas/SectionConfigEditorial'
        - $ref: '#/components/schemas/SectionConfigCategoryGrid'
        - $ref: '#/components/schemas/SectionConfigCollectionFeature'
        - $ref: '#/components/schemas/SectionConfigFeaturedProducts'
        - $ref: '#/components/schemas/SectionConfigOccasionGrid'
        - $ref: '#/components/schemas/SectionConfigLookbookGallery'
        - $ref: '#/components/schemas/SectionConfigCraftsmanship'
        - $ref: '#/components/schemas/SectionConfigTestimonials'
        - $ref: '#/components/schemas/SectionConfigNewsletter'
        - $ref: '#/components/schemas/SectionConfigAppointmentCta'
        - $ref: '#/components/schemas/SectionConfigSocialGallery'
    SectionLink:
      type: [string, 'null']
      maxLength: 300
      pattern: '^(/\S*|https://\S+)$'
      description: Relative path or https URL.
    SectionHeading:
      type: object
      properties:
        eyebrow: { type: [string, 'null'], maxLength: 80 }
        title: { type: [string, 'null'], maxLength: 140 }
        subtitle: { type: [string, 'null'], maxLength: 300 }
    SectionConfigHero:
      type: object
      description: '`hero_image` (desktop_media_id required, video prohibited) and `hero_video` (video_media_id required).'
      required: [headline]
      properties:
        eyebrow: { type: [string, 'null'], maxLength: 80 }
        headline: { type: string, maxLength: 120 }
        subtitle: { type: [string, 'null'], maxLength: 300 }
        cta_label: { type: [string, 'null'], maxLength: 60 }
        cta_url: { $ref: '#/components/schemas/SectionLink' }
        desktop_media_id: { type: [integer, 'null'] }
        mobile_media_id: { type: [integer, 'null'] }
        video_media_id: { type: [integer, 'null'] }
        align: { type: [string, 'null'], enum: [left, center, right, null] }
        overlay_opacity: { type: [number, 'null'], minimum: 0, maximum: 0.8 }
        height: { type: [string, 'null'], enum: [full, large, medium, null] }
    SectionConfigEditorial:
      description: '`split_editorial`, `text_image`, `brand_story`.'
      allOf:
        - $ref: '#/components/schemas/SectionHeading'
        - type: object
          properties:
            body: { type: [string, 'null'], maxLength: 3000 }
            media_id: { type: [integer, 'null'] }
            image_position: { type: [string, 'null'], enum: [left, right, null] }
            cta_label: { type: [string, 'null'], maxLength: 60 }
            cta_url: { $ref: '#/components/schemas/SectionLink' }
            theme: { type: [string, 'null'], enum: [ivory, white, navy, ice, null] }
    SectionConfigCategoryGrid:
      allOf:
        - $ref: '#/components/schemas/SectionHeading'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              minItems: 1
              maxItems: 8
              items:
                type: object
                required: [category_id]
                properties:
                  category_id: { type: integer }
                  label: { type: [string, 'null'], maxLength: 60 }
                  media_id: { type: [integer, 'null'] }
            layout: { type: [string, 'null'], enum: [grid, carousel, null] }
    SectionConfigCollectionFeature:
      allOf:
        - $ref: '#/components/schemas/SectionHeading'
        - type: object
          required: [collection_id]
          properties:
            collection_id: { type: integer }
            body: { type: [string, 'null'], maxLength: 2000 }
            media_id: { type: [integer, 'null'] }
            image_position: { type: [string, 'null'], enum: [left, right, null] }
            cta_label: { type: [string, 'null'], maxLength: 60 }
            cta_url: { $ref: '#/components/schemas/SectionLink' }
            theme: { type: [string, 'null'], enum: [ivory, white, navy, ice, null] }
    SectionConfigFeaturedProducts:
      allOf:
        - $ref: '#/components/schemas/SectionHeading'
        - type: object
          required: [source]
          properties:
            source: { type: string, enum: [new_arrivals, bestsellers, featured, collection, manual] }
            collection_id: { type: [integer, 'null'], description: "Required when source is `collection`." }
            product_ids:
              type: array
              maxItems: 24
              items: { type: integer }
              description: Required when source is `manual`.
            limit: { type: [integer, 'null'], minimum: 2, maximum: 16 }
            layout: { type: [string, 'null'], enum: [grid, carousel, null] }
            cta_label: { type: [string, 'null'], maxLength: 60 }
            cta_url: { $ref: '#/components/schemas/SectionLink' }
    SectionConfigOccasionGrid:
      allOf:
        - $ref: '#/components/schemas/SectionHeading'
        - type: object
          properties:
            occasion_ids:
              type: [array, 'null']
              maxItems: 12
              items: { type: integer }
    SectionConfigLookbookGallery:
      allOf:
        - $ref: '#/components/schemas/SectionHeading'
        - type: object
          properties:
            lookbook_id: { type: [integer, 'null'] }
            items:
              type: [array, 'null']
              maxItems: 12
              items:
                type: object
                required: [media_id]
                properties:
                  media_id: { type: integer }
                  caption: { type: [string, 'null'], maxLength: 120 }
                  link_url: { $ref: '#/components/schemas/SectionLink' }
            cta_label: { type: [string, 'null'], maxLength: 60 }
            cta_url: { $ref: '#/components/schemas/SectionLink' }
    SectionConfigCraftsmanship:
      allOf:
        - $ref: '#/components/schemas/SectionHeading'
        - type: object
          properties:
            body: { type: [string, 'null'], maxLength: 2000 }
            media_id: { type: [integer, 'null'] }
            pillars:
              type: [array, 'null']
              maxItems: 4
              items:
                type: object
                required: [title]
                properties:
                  title: { type: string, maxLength: 80 }
                  body: { type: [string, 'null'], maxLength: 500 }
                  media_id: { type: [integer, 'null'] }
            cta_label: { type: [string, 'null'], maxLength: 60 }
            cta_url: { $ref: '#/components/schemas/SectionLink' }
    SectionConfigTestimonials:
      allOf:
        - $ref: '#/components/schemas/SectionHeading'
        - type: object
          properties:
            limit: { type: [integer, 'null'], minimum: 1, maximum: 12 }
    SectionConfigNewsletter:
      allOf:
        - $ref: '#/components/schemas/SectionHeading'
        - type: object
          properties:
            body: { type: [string, 'null'], maxLength: 500 }
            consent_text: { type: [string, 'null'], maxLength: 300 }
    SectionConfigAppointmentCta:
      allOf:
        - $ref: '#/components/schemas/SectionHeading'
        - type: object
          properties:
            body: { type: [string, 'null'], maxLength: 1000 }
            media_id: { type: [integer, 'null'] }
            consultation_label: { type: [string, 'null'], maxLength: 60 }
            whatsapp_label: { type: [string, 'null'], maxLength: 60 }
    SectionConfigSocialGallery:
      allOf:
        - $ref: '#/components/schemas/SectionHeading'
        - type: object
          properties:
            handle: { type: [string, 'null'], maxLength: 60 }
            profile_url: { type: [string, 'null'], format: uri, maxLength: 300 }
            items:
              type: [array, 'null']
              maxItems: 12
              items:
                type: object
                required: [media_id]
                properties:
                  media_id: { type: integer }
                  link_url: { type: [string, 'null'], format: uri, maxLength: 300 }
                  alt: { type: [string, 'null'], maxLength: 200 }
    CmsPage:
      type: object
      required: [title, slug, template, seo]
      properties:
        title: { type: string }
        slug: { type: string }
        template: { type: string, enum: [default, story, policy, contact] }
        excerpt: { type: [string, 'null'] }
        body: { type: [string, 'null'], description: "Sanitized HTML." }
        hero: { $ref: '#/components/schemas/NullableMedia' }
        updated_at: { type: [string, 'null'], format: date-time }
        seo: { $ref: '#/components/schemas/Seo' }
    LookbookSummary:
      type: object
      required: [title, slug, url]
      properties:
        title: { type: string }
        slug: { type: string }
        url: { type: string, examples: [/lookbook/festive-2026] }
        season: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        cover: { $ref: '#/components/schemas/NullableMedia' }
    Lookbook:
      type: object
      required: [title, slug, items, seo]
      properties:
        title: { type: string }
        slug: { type: string }
        season: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        cover: { $ref: '#/components/schemas/NullableMedia' }
        collection:
          anyOf:
            - { $ref: '#/components/schemas/NameUrl' }
            - type: 'null'
        items:
          type: array
          items:
            type: object
            required: [media, layout]
            properties:
              media: { $ref: '#/components/schemas/Media' }
              caption: { type: [string, 'null'] }
              layout: { type: string, enum: [portrait, landscape, full] }
              product:
                anyOf:
                  - { $ref: '#/components/schemas/NameUrl' }
                  - type: 'null'
              collection:
                anyOf:
                  - { $ref: '#/components/schemas/NameUrl' }
                  - type: 'null'
        seo: { $ref: '#/components/schemas/Seo' }
    NameUrl:
      type: object
      required: [name, url]
      properties:
        name: { type: string }
        url: { type: string }

    # ------------------------------------------------------------------ catalog
    CategorySummary:
      type: object
      required: [id, department_id, name, slug, path, url]
      properties:
        id: { type: integer }
        department_id: { type: integer }
        name: { type: string }
        slug: { type: string }
        path: { type: string, examples: [women/lehengas] }
        url: { type: string, examples: [/shop/women/lehengas] }
        show_in_menu: { type: boolean }
        image: { $ref: '#/components/schemas/NullableMedia' }
    CategoryTreeNode:
      allOf:
        - $ref: '#/components/schemas/CategorySummary'
        - type: object
          required: [children]
          properties:
            children:
              type: array
              items: { $ref: '#/components/schemas/CategoryTreeNode' }
    ListingContext:
      type: object
      description: |
        Header/context data for a listing landing page. Products are fetched separately via
        `GET /products?{type}=...`. Fields present depend on `type`:
        department (`path`, `intro`, `banner`, `breadcrumbs`, `children`), category (+ `department`),
        collection (`tagline`, `story`, `cover`, `banner`, `ends_at`), occasion (`description`, `banner`).
      required: [type, name, slug, seo]
      properties:
        type: { type: string, enum: [department, category, collection, occasion] }
        name: { type: string }
        slug: { type: string }
        path: { type: string }
        intro: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        tagline: { type: [string, 'null'] }
        story: { type: [string, 'null'] }
        banner: { $ref: '#/components/schemas/NullableMedia' }
        cover: { $ref: '#/components/schemas/NullableMedia' }
        ends_at: { type: [string, 'null'], format: date-time }
        department:
          type: object
          properties:
            name: { type: string }
            slug: { type: string }
        breadcrumbs:
          type: array
          items: { $ref: '#/components/schemas/Breadcrumb' }
        children:
          type: array
          items: { $ref: '#/components/schemas/CategorySummary' }
        seo: { $ref: '#/components/schemas/Seo' }
      example:
        type: category
        name: Lehengas
        slug: lehengas
        path: women/lehengas
        intro: Hand-embroidered lehengas for weddings and celebrations.
        banner: null
        department: { name: Women, slug: women }
        breadcrumbs:
          - { name: Women, path: women }
          - { name: Lehengas, path: women/lehengas }
        children: []
        seo:
          title: Lehengas — Women
          description: Hand-embroidered lehengas for weddings and celebrations.
          canonical_url: https://www.example.com/shop/women/lehengas
    Pricing:
      type: object
      description: Pricing payload shared by cards and detail pages. Price-on-request products never expose a figure.
      required: [price_mode, price, compare_at_price, currency, price_label, cta_label]
      properties:
        price_mode: { $ref: '#/components/schemas/PriceMode' }
        price: { type: [number, 'null'], description: "Null for `on_request`." }
        compare_at_price: { type: [number, 'null'], description: "Only for `fixed` prices higher than `price`." }
        currency: { type: string, examples: [INR] }
        price_label: { type: string, examples: ['₹64,500', 'From ₹48,000', Price on Request] }
        cta_label: { type: string, enum: [Order on WhatsApp, Enquire on WhatsApp, Request Price on WhatsApp] }
    ColorSwatch:
      type: object
      required: [code, label]
      properties:
        code: { type: string }
        label: { type: string }
        hex: { type: [string, 'null'] }
    ProductCard:
      allOf:
        - type: object
          required: [id, slug, name, url, badges, colors, is_available, allows_custom_size]
          properties:
            id: { type: integer }
            slug: { type: string }
            name: { type: string }
            url: { type: string }
            category: { type: [string, 'null'], description: "Primary category name." }
            badges:
              type: array
              items: { type: string, enum: [New, Exclusive, Made to Order] }
            image: { $ref: '#/components/schemas/NullableMedia' }
            hover_image: { $ref: '#/components/schemas/NullableMedia' }
            colors:
              type: array
              items: { $ref: '#/components/schemas/ColorSwatch' }
            is_available: { type: boolean }
            allows_custom_size: { type: boolean }
        - $ref: '#/components/schemas/Pricing'
    ProductCardPage:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ProductCard' }
        links: { $ref: '#/components/schemas/PaginationLinks' }
        meta: { $ref: '#/components/schemas/PaginatedMeta' }
    Variant:
      type: object
      description: Public variant. Stock quantities are never exposed.
      required: [id, sku, availability, availability_label, is_enquirable]
      properties:
        id: { type: integer }
        sku: { type: string }
        size_id: { type: [integer, 'null'] }
        color_id: { type: [integer, 'null'] }
        price: { type: [number, 'null'] }
        price_label: { type: [string, 'null'] }
        compare_at_price: { type: [number, 'null'] }
        availability: { $ref: '#/components/schemas/Availability' }
        availability_label: { type: string, enum: [In stock, Only a few left, Made to order, Currently unavailable] }
        is_enquirable: { type: boolean, description: "False only when out of stock." }
        image: { $ref: '#/components/schemas/NullableMedia' }
    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/Pricing'
        - type: object
          required: [id, slug, sku, name, url, gallery, options, variants, seo]
          properties:
            id: { type: integer }
            slug: { type: string }
            sku: { type: string }
            name: { type: string }
            brand: { type: [string, 'null'] }
            url: { type: string }
            short_description: { type: [string, 'null'] }
            description: { type: [string, 'null'], description: HTML. }
            badges:
              type: array
              items: { type: string, enum: [New, Exclusive] }
            department:
              anyOf:
                - type: object
                  properties:
                    name: { type: string }
                    slug: { type: string }
                - type: 'null'
            category:
              anyOf:
                - type: object
                  properties:
                    name: { type: string }
                    path: { type: string }
                - type: 'null'
            breadcrumbs:
              type: array
              items: { $ref: '#/components/schemas/Breadcrumb' }
            collections:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  slug: { type: string }
            occasions:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  slug: { type: string }
            tags:
              type: array
              items: { type: string }
            gallery:
              type: array
              items:
                type: object
                required: [id, role, media]
                properties:
                  id: { type: integer }
                  role: { type: string, enum: [gallery, alternate, detail, video] }
                  color_code: { type: [string, 'null'] }
                  media: { $ref: '#/components/schemas/Media' }
            options:
              type: object
              properties:
                sizes:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: integer }
                      code: { type: string }
                      label: { type: string }
                      group: { type: [string, 'null'] }
                colors:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: integer }
                      code: { type: string }
                      label: { type: string }
                      hex: { type: [string, 'null'] }
            variants:
              type: array
              items: { $ref: '#/components/schemas/Variant' }
            allows_custom_size: { type: boolean }
            is_made_to_order: { type: boolean }
            lead_time: { type: [string, 'null'], examples: [Approximately 3–5 weeks] }
            set_includes: { type: [string, 'null'] }
            craftsmanship: { type: [string, 'null'] }
            care_instructions: { type: [string, 'null'] }
            delivery_notes: { type: [string, 'null'] }
            country_of_origin: { type: [string, 'null'] }
            tax_note: { type: [string, 'null'] }
            attributes:
              type: array
              items:
                type: object
                properties:
                  code: { type: string }
                  name: { type: string }
                  group: { type: string, enum: [details, craft, care] }
                  value: { type: string }
            size_chart:
              anyOf:
                - type: object
                  properties:
                    name: { type: string }
                    unit: { type: string, enum: [in, cm] }
                    description: { type: [string, 'null'] }
                    chart: { $ref: '#/components/schemas/SizeChartGrid' }
                    measurement_guide: { type: [string, 'null'] }
                    guide_url: { type: [string, 'null'] }
                - type: 'null'
            related:
              type: array
              items: { $ref: '#/components/schemas/ProductCard' }
            complete_the_look:
              type: array
              items: { $ref: '#/components/schemas/ProductCard' }
            published_at: { type: [string, 'null'], format: date-time }
            seo: { $ref: '#/components/schemas/Seo' }
    SizeChartGrid:
      anyOf:
        - type: object
          properties:
            columns:
              type: array
              items: { type: string, maxLength: 40 }
            rows:
              type: array
              items:
                type: array
                items: { type: [string, 'null'], maxLength: 40 }
        - type: 'null'
    FacetValue:
      type: object
      required: [value, label, count]
      properties:
        value: { type: string }
        label: { type: string }
        hex: { type: string, description: "Colours only." }
        count: { type: integer }
    Facets:
      type: object
      required: [subcategories, sizes, colors, attributes, occasions, collections, price]
      properties:
        subcategories:
          type: array
          items: { $ref: '#/components/schemas/FacetValue' }
        sizes:
          type: array
          items: { $ref: '#/components/schemas/FacetValue' }
        colors:
          type: array
          items: { $ref: '#/components/schemas/FacetValue' }
        attributes:
          type: array
          items:
            type: object
            required: [code, name, values]
            properties:
              code: { type: string }
              name: { type: string }
              values:
                type: array
                items: { $ref: '#/components/schemas/FacetValue' }
        occasions:
          type: array
          items: { $ref: '#/components/schemas/FacetValue' }
        collections:
          type: array
          items: { $ref: '#/components/schemas/FacetValue' }
        price:
          type: object
          properties:
            min: { type: [number, 'null'] }
            max: { type: [number, 'null'] }
    SearchResults:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ProductCard' }
        links: { $ref: '#/components/schemas/PaginationLinks' }
        meta:
          allOf:
            - $ref: '#/components/schemas/PaginatedMeta'
            - type: object
              required: [query, corrected_query]
              properties:
                query: { type: string }
                corrected_query: { type: [string, 'null'] }
                recommendations:
                  type: array
                  description: Present only when there are no results.
                  items: { $ref: '#/components/schemas/ProductCard' }
    SearchSuggestions:
      type: object
      required: [products, categories, collections, corrected_query]
      properties:
        products:
          type: array
          maxItems: 6
          items: { $ref: '#/components/schemas/ProductCard' }
        categories:
          type: array
          maxItems: 5
          items:
            type: object
            properties:
              label: { type: string }
              url: { type: string }
              context: { type: string, examples: [Women] }
        collections:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/LinkItem' }
        corrected_query: { type: [string, 'null'] }

    # ------------------------------------------------------------------ enquiries (storefront)
    EnquiryRequest:
      type: object
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/EnquiryType' }
        items:
          type: array
          maxItems: 20
          description: Required for `product` and `bag`.
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: { type: integer }
              variant_id: { type: [integer, 'null'] }
              color_value_id: { type: [integer, 'null'] }
              custom_size: { type: [boolean, 'null'] }
              quantity: { type: integer, minimum: 1, maximum: 10 }
        customer:
          type: [object, 'null']
          description: Stored only with `privacy_consent`.
          properties:
            name: { type: [string, 'null'], maxLength: 150 }
            phone: { type: [string, 'null'], maxLength: 32, pattern: '^\+?[0-9\s\-()]{7,20}$' }
            email: { type: [string, 'null'], format: email, maxLength: 190 }
            city: { type: [string, 'null'], maxLength: 120 }
            country: { type: [string, 'null'], maxLength: 80 }
            message: { type: [string, 'null'], maxLength: 2000 }
            marketing_consent: { type: [boolean, 'null'] }
        privacy_consent:
          type: [boolean, 'null']
          description: Required and must be accepted when `customer.phone` or `customer.email` is provided.
        measurements:
          type: [object, 'null']
          maxProperties: 12
          description: Free-form measurement name → value (max 60 chars each). Kept only for custom-size items or consultations; stored encrypted.
          additionalProperties: { type: [string, 'null'], maxLength: 60 }
        fitting_consultation: { type: [boolean, 'null'] }
        preferred_date: { type: [string, 'null'], format: date, description: "Today or later, within one year." }
        source_path: { type: [string, 'null'], maxLength: 500 }
        referrer: { type: [string, 'null'], maxLength: 500, description: "Only the host is stored, and only with attribution consent." }
        attribution_consent: { type: [boolean, 'null'] }
        utm:
          type: [object, 'null']
          properties:
            source: { type: [string, 'null'], maxLength: 100 }
            medium: { type: [string, 'null'], maxLength: 100 }
            campaign: { type: [string, 'null'], maxLength: 150 }
            content: { type: [string, 'null'], maxLength: 150 }
            term: { type: [string, 'null'], maxLength: 150 }
        website: { type: string, maxLength: 0, description: "Honeypot — must be absent or empty." }
    EnquiryResult:
      type: object
      required: [reference, status, whatsapp_url, message, summary_url, summary_token]
      properties:
        reference: { type: string, pattern: '^GND-ENQ-\d{6,}$' }
        status:
          type: string
          const: initiated
          description: The hand-off was initiated. This never means a WhatsApp message was sent.
        whatsapp_url:
          type: [string, 'null']
          description: '`https://wa.me/<number>?text=<rawurlencoded message>`; null when WhatsApp is disabled or unconfigured.'
        message: { type: string, description: "The plain-text WhatsApp message." }
        summary_url: { type: string, description: "Shareable storefront summary page (`/enquiry/{summary_token}`)." }
        summary_token: { type: string, minLength: 40, maxLength: 40 }
    EnquirySummary:
      type: object
      required: [reference, created_at, items]
      properties:
        reference: { type: string }
        created_at: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            properties:
              product_name: { type: string }
              reference: { type: string, description: "Product SKU." }
              size: { type: [string, 'null'] }
              color: { type: [string, 'null'] }
              quantity: { type: integer }
              price_label: { type: [string, 'null'] }
              url: { type: [string, 'null'], description: "Null when the product is no longer public." }
        display_total: { type: [string, 'null'] }
        whatsapp_url: { type: [string, 'null'] }
      example:
        reference: GND-ENQ-000124
        created_at: '2026-10-09T10:20:00+00:00'
        items:
          - product_name: Neelam Midnight Silk Lehenga Set
            reference: GND-LEH-001
            size: M
            color: Midnight Blue
            quantity: 1
            price_label: '₹64,500'
            url: /products/neelam-midnight-silk-lehenga-set
        display_total: '₹64,500'
        whatsapp_url: https://wa.me/911234567890?text=Hello%20Grace%20New%20Designers%2C...
    AnalyticsEventsRequest:
      type: object
      required: [events]
      properties:
        session_id: { type: [string, 'null'], maxLength: 64 }
        events:
          type: array
          maxItems: 20
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
                enum: [page_view, view_item_list, select_item, view_item, search, select_size, select_color, add_to_wishlist, add_to_bag]
              product_id: { type: [integer, 'null'] }
              path: { type: [string, 'null'], maxLength: 500 }
              params:
                type: [object, 'null']
                maxProperties: 10
                description: Only list_name, search_term, size, color, results, category, quantity are stored.
                additionalProperties: { type: [string, number, boolean, 'null'] }

    # ------------------------------------------------------------------ admin auth / team
    CurrentUser:
      type: object
      required: [id, name, email, roles, permissions, two_factor_enabled, two_factor_required]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        roles:
          type: array
          items:
            type: object
            properties:
              slug: { type: string }
              name: { type: string }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/PermissionSlug' }
        two_factor_enabled: { type: boolean }
        two_factor_required: { type: boolean }
        last_login_at: { type: [string, 'null'], format: date-time }
    TwoFactorRequired:
      type: object
      required: [two_factor_required]
      properties:
        two_factor_required: { type: boolean, const: true }
    TeamUser:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: [string, 'null'] }
        is_active: { type: boolean }
        roles:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              slug: { type: string }
              name: { type: string }
        two_factor_enabled: { type: boolean }
        last_login_at: { type: [string, 'null'], format: date-time }
    UserModel:
      type: object
      description: User model attributes (secrets hidden) with loaded `roles`.
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: [string, 'null'] }
        is_active: { type: boolean }
        roles:
          type: array
          items: { type: object }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
    RolesResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              slug: { type: string, examples: [owner, administrator, catalog-manager, enquiry-manager, content-editor] }
              description: { type: [string, 'null'] }
              is_system: { type: boolean }
              requires_mfa: { type: boolean }
              users_count: { type: integer }
              permissions:
                type: array
                items: { $ref: '#/components/schemas/PermissionSlug' }
        meta:
          type: object
          properties:
            permission_groups:
              type: object
              description: Group (catalog, media, sales, content, system) → permission slug → description.
              additionalProperties:
                type: object
                additionalProperties: { type: string }

    # ------------------------------------------------------------------ admin dashboard
    Dashboard:
      type: object
      properties:
        catalogue:
          type: object
          properties:
            live_products: { type: integer }
            published_products: { type: integer }
            scheduled_products: { type: integer }
            draft_products: { type: integer }
            out_of_stock_variants: { type: integer }
            low_stock_variants: { type: integer }
        measured:
          type: object
          properties:
            note: { type: string }
            enquiry_intents_today: { type: integer }
            enquiry_intents_month: { type: integer }
            most_viewed_products:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  views: { type: integer }
            most_enquired_products:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  enquiries: { type: integer }
        pipeline:
          type: object
          properties:
            new_leads: { type: integer }
            awaiting_follow_up: { type: integer }
            overdue_follow_ups: { type: integer }
        confirmed:
          type: object
          properties:
            note: { type: string }
            orders_confirmed_month: { type: integer }
            orders_in_progress: { type: integer }
            confirmed_value_month: { type: string, examples: ['₹1,24,500'] }
            payments_recorded_month: { type: string }
        recent_catalogue_changes:
          type: array
          items:
            type: object
            properties:
              description: { type: string }
              user: { type: [string, 'null'] }
              created_at: { type: [string, 'null'], format: date-time }
        generated_at: { type: string, format: date-time }
    Reports:
      type: object
      properties:
        range_days: { type: integer, enum: [7, 30, 90, 365] }
        enquiries_by_day:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              count: { type: integer }
        enquiries_by_status:
          type: [object, array]
          additionalProperties: { type: integer }
        enquiries_by_type:
          type: [object, array]
          additionalProperties: { type: integer }
        enquiries_by_source:
          type: [object, array]
          description: Top 10 sources (`direct / not consented` when unknown).
          additionalProperties: { type: integer }
        orders:
          type: object
          properties:
            recorded: { type: integer }
            confirmed: { type: integer }
            confirmed_value: { type: number }
            from_enquiries: { type: integer }
        enquiry_to_order_rate: { type: [number, 'null'], description: "Percentage of non-spam enquiry intents that led to a confirmed order." }

    # ------------------------------------------------------------------ admin products
    AdminProductListItem:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        sku: { type: string }
        status: { $ref: '#/components/schemas/ProductStatus' }
        is_live: { type: boolean }
        published_at: { type: [string, 'null'], format: date-time }
        price_mode: { $ref: '#/components/schemas/PriceMode' }
        price_label: { type: [string, 'null'] }
        thumb_url: { type: [string, 'null'] }
        categories:
          type: array
          items: { type: string }
        variant_count: { type: integer }
        out_of_stock_variants: { type: integer }
        is_featured: { type: boolean }
        enquiry_count: { type: integer }
        updated_at: { type: [string, 'null'], format: date-time }
        deleted_at: { type: [string, 'null'], format: date-time }
    AdminVariantInput:
      type: object
      required: [sku, stock_quantity, stock_policy]
      properties:
        id: { type: [integer, 'null'], description: "Existing variant id of this product (update)." }
        sku: { type: string, maxLength: 80, pattern: '^[A-Za-z0-9\-_]+$', description: "Unique (case-insensitive) within the request and across other products." }
        size_value_id: { type: [integer, 'null'], description: "Value of the `size` option." }
        color_value_id: { type: [integer, 'null'], description: "Value of the `color` option." }
        price: { type: [number, 'null'], minimum: 0, maximum: 99999999 }
        compare_at_price: { type: [number, 'null'], minimum: 0, maximum: 99999999 }
        stock_quantity: { type: integer, minimum: 0, maximum: 100000 }
        stock_policy: { $ref: '#/components/schemas/StockPolicy' }
        low_stock_threshold: { type: [integer, 'null'], minimum: 0, maximum: 1000 }
        media_asset_id: { type: [integer, 'null'] }
        is_active: { type: boolean }
    AdminProductUpdate:
      type: object
      description: ProductRequest payload (all fields optional on update; see AdminProduct for create).
      properties:
        name: { type: string, maxLength: 200 }
        slug: { type: [string, 'null'], maxLength: 200, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', description: "Unique; generated from name when empty." }
        sku: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9\-_]+$', description: "Unique." }
        brand: { type: [string, 'null'], maxLength: 120 }
        short_description: { type: [string, 'null'], maxLength: 600 }
        description: { type: [string, 'null'], maxLength: 20000, description: "HTML (sanitized)." }
        department_id: { type: [integer, 'null'] }
        status: { $ref: '#/components/schemas/ProductStatus' }
        published_at: { type: [string, 'null'], format: date-time }
        price_mode: { $ref: '#/components/schemas/PriceMode' }
        price:
          type: [number, 'null']
          minimum: 0
          maximum: 99999999
          description: Required for `fixed` unless every variant has a price.
        compare_at_price: { type: [number, 'null'], minimum: 0, maximum: 99999999, description: "Must be ≥ price." }
        cost_price: { type: [number, 'null'], minimum: 0, maximum: 99999999, description: "Internal — never exposed publicly." }
        currency: { type: string, minLength: 3, maxLength: 3 }
        show_price: { type: boolean }
        tax_note: { type: [string, 'null'], maxLength: 255 }
        is_featured: { type: boolean }
        is_new_arrival: { type: boolean }
        is_bestseller: { type: boolean }
        is_exclusive: { type: boolean }
        recommendation_priority: { type: integer, minimum: -100, maximum: 100 }
        allows_custom_size: { type: boolean }
        is_made_to_order: { type: boolean }
        lead_time_min_days: { type: [integer, 'null'], minimum: 0, maximum: 365 }
        lead_time_max_days: { type: [integer, 'null'], minimum: 0, maximum: 365, description: '≥ lead_time_min_days.' }
        set_includes: { type: [string, 'null'], maxLength: 255 }
        craftsmanship: { type: [string, 'null'], maxLength: 5000 }
        care_instructions: { type: [string, 'null'], maxLength: 3000 }
        delivery_notes: { type: [string, 'null'], maxLength: 3000 }
        country_of_origin: { type: [string, 'null'], maxLength: 80 }
        size_chart_id: { type: [integer, 'null'] }
        seo_title: { type: [string, 'null'], maxLength: 255 }
        seo_description: { type: [string, 'null'], maxLength: 500 }
        canonical_url: { type: [string, 'null'], format: uri, maxLength: 500 }
        og_media_id: { type: [integer, 'null'] }
        is_indexable: { type: boolean }
        internal_notes: { type: [string, 'null'], maxLength: 5000, description: "Internal — never exposed publicly." }
        category_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: integer }
        primary_category_id: { type: [integer, 'null'], description: "Must be one of category_ids." }
        collection_ids:
          type: array
          maxItems: 30
          uniqueItems: true
          items: { type: integer }
        occasion_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: integer }
        tags:
          type: array
          maxItems: 30
          description: Tag names (created when new).
          items: { type: string, maxLength: 60 }
        variants:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/AdminVariantInput' }
        media:
          type: array
          maxItems: 40
          items:
            type: object
            required: [media_asset_id]
            properties:
              media_asset_id: { type: integer }
              role: { type: [string, 'null'], enum: [gallery, alternate, detail, video, null] }
              alt_text: { type: [string, 'null'], maxLength: 300 }
              color_value_id: { type: [integer, 'null'] }
        attributes:
          type: array
          maxItems: 50
          items:
            type: object
            required: [attribute_id]
            properties:
              attribute_id: { type: integer }
              value_ids:
                type: [array, 'null']
                items: { type: integer }
              value_text: { type: [string, 'null'], maxLength: 2000 }
        related_product_ids:
          type: array
          maxItems: 24
          items: { type: integer }
        complete_the_look_ids:
          type: array
          maxItems: 12
          items: { type: integer }
    AdminProduct:
      description: ProductRequest payload for creating a product (`name`, `sku`, `price_mode` required).
      allOf:
        - $ref: '#/components/schemas/AdminProductUpdate'
        - type: object
          required: [name, sku, price_mode]
    AdminProductResource:
      type: object
      description: Full admin product representation, including internal fields. Decimal fields are strings.
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        sku: { type: string }
        brand: { type: [string, 'null'] }
        short_description: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
