    patch:
      tags: ['Admin: Customers']
      operationId: adminUpdateCustomer
      summary: Update a customer
      description: '**Permission:** `customers.manage`. Changing `marketing_consent` stamps/clears `marketing_consent_at`.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerUpdate' }
      responses:
        '200':
          description: Updated customer.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/customers/{customer}/anonymize:
    parameters:
      - { name: customer, in: path, required: true, schema: { type: integer }, description: "Customer id." }
    post:
      tags: ['Admin: Customers']
      operationId: adminAnonymizeCustomer
      summary: Anonymize a customer (privacy request)
      description: |
        **Permission:** `customers.manage`. Erases personal data (and the matching newsletter subscription) while
        keeping anonymous operational records (enquiries, orders). Irreversible.
      responses:
        '204': { description: "Anonymized." }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/newsletter-subscribers:
    get:
      tags: ['Admin: Customers']
      operationId: adminListNewsletterSubscribers
      summary: Active newsletter subscribers
      description: '**Permission:** `customers.view`. 50 per page.'
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Subscribers.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, email, consented_at]
                      properties:
                        id: { type: integer }
                        email: { type: string, format: email }
                        source: { type: [string, 'null'] }
                        consented_at: { type: string, format: date-time }
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer }
                      last_page: { type: integer }
                      total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ============================================================================================
  # Admin — homepage builder
  # ============================================================================================
  /api/v1/admin/homepage/sections:
    get:
      tags: ['Admin: Homepage']
      operationId: adminListHomepageSections
      summary: List homepage sections (draft state)
      description: '**Permission:** `content.manage`. `meta.types` lists every section type with its default config.'
      responses:
        '200':
          description: Sections in draft order.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminHomepageSection' }
                  meta:
                    type: object
                    properties:
                      has_unpublished_changes: { type: boolean }
                      last_published_at: { type: [string, 'null'], format: date-time }
                      types:
                        type: array
                        items:
                          type: object
                          properties:
                            value: { $ref: '#/components/schemas/SectionType' }
                            label: { type: string }
                            defaults: { type: [object, array] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: ['Admin: Homepage']
      operationId: adminCreateHomepageSection
      summary: Add a section (draft)
      description: |
        **Permission:** `content.manage`. `config` is merged over the type's defaults and validated against the
        type's schema (see `SectionConfig*` schemas); plain text only — HTML is stripped. Appended to the end of
        the draft order. Not visible on the storefront until `POST /admin/homepage/publish`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, name]
              properties:
                type: { $ref: '#/components/schemas/SectionType' }
                name: { type: string, maxLength: 150 }
                config: { $ref: '#/components/schemas/SectionConfig' }
                starts_at: { type: [string, 'null'], format: date-time }
                ends_at: { type: [string, 'null'], format: date-time, description: "Must be after starts_at." }
            example:
              type: featured_products
              name: New arrivals carousel
              config:
                title: New Arrivals
                source: new_arrivals
                limit: 8
                layout: carousel
      responses:
        '201':
          description: Created section.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AdminHomepageSection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/homepage/sections/reorder:
    post:
      tags: ['Admin: Homepage']
      operationId: adminReorderHomepageSections
      summary: Reorder draft sections
      description: '**Permission:** `content.manage`. Array order becomes draft order.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: integer }
      responses:
        '204': { description: "Reordered." }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/homepage/sections/{section}:
    parameters:
      - $ref: '#/components/parameters/SectionIdPath'
    patch:
      tags: ['Admin: Homepage']
      operationId: adminUpdateHomepageSection
      summary: Update a section (draft)
      description: |
        **Permission:** `content.manage`. `config` replaces the draft config and is validated for the section's
        type. Schedule changes (`starts_at`/`ends_at`) take effect immediately on the live homepage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 150 }
                config: { $ref: '#/components/schemas/SectionConfig' }
                is_enabled: { type: boolean }
                starts_at: { type: [string, 'null'], format: date-time }
                ends_at: { type: [string, 'null'], format: date-time }
      responses:
        '200':
          description: Updated section.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AdminHomepageSection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: ['Admin: Homepage']
      operationId: adminDeleteHomepageSection
      summary: Remove a section
      description: |
        **Permission:** `content.manage`. Unpublished sections are deleted immediately; published sections are
        flagged `pending_removal` and removed on the next publish (undo with `/restore`).
      responses:
        '204': { description: "Removed or flagged for removal." }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/homepage/sections/{section}/restore:
    parameters:
      - $ref: '#/components/parameters/SectionIdPath'
    post:
      tags: ['Admin: Homepage']
      operationId: adminRestoreHomepageSection
      summary: Cancel a pending removal
      description: '**Permission:** `content.manage`.'
      responses:
        '200':
          description: Section.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AdminHomepageSection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/homepage/publish:
    post:
      tags: ['Admin: Homepage']
      operationId: adminPublishHomepage
      summary: Publish the draft homepage
      description: '**Permission:** `content.manage`. Promotes every draft atomically and revalidates the storefront.'
      responses:
        '200':
          description: Published.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [published_sections, published_at]
                    properties:
                      published_sections: { type: integer }
                      published_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/homepage/discard:
    post:
      tags: ['Admin: Homepage']
      operationId: adminDiscardHomepageDraft
      summary: Discard unpublished homepage changes
      description: '**Permission:** `content.manage`. Deletes never-published sections and resets drafts to the live state.'
      responses:
        '204': { description: "Discarded." }
        '401': { $ref: '#/components/responses/Unauthenticated' }
