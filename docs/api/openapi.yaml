  /api/v1/admin/products/import:
    post:
      tags: ['Admin: Import/Export']
      operationId: adminStartProductImport
      summary: Upload a CSV for import (queued)
      description: |
        **Permission:** `products.import`. The file is processed by a queued job; poll
        `GET /admin/products/imports/{import}`. Use `dry_run=true` to validate and preview without writing, then
        `POST /admin/products/imports/{import}/commit`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, dry_run]
