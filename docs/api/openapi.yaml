  # ============================================================================================
  # Admin — navigation
  # ============================================================================================
  /api/v1/admin/navigation:
    get:
      tags: ['Admin: Navigation']
      operationId: adminListMenus
      summary: List navigation menus with item trees
      description: '**Permission:** `navigation.manage`.'
      responses:
        '200':
          description: Menus.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMenusResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/admin/navigation/{menu}:
    parameters:
      - { name: menu, in: path, required: true, schema: { type: integer }, description: "Menu id." }
    put:
      tags: ['Admin: Navigation']
      operationId: adminSaveMenu
      summary: Replace a menu's item tree
      description: |
        **Permission:** `navigation.manage`. Up to three levels (40 items per level). Items with an `id` are
        updated, new ones created, and omitted ones deleted. `url` items must be a `/path`, `https://`, `mailto:` or
        `tel:` link; `route` items name a storefront route in `url`; other link types require `link_id`.
        Returns all menus (same as GET).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 40
                  items: { $ref: '#/components/schemas/NavigationItemInput' }
            example:
              items:
                - label: Women
                  link_type: department
                  link_id: 1
                  children:
                    - label: Lehengas
                      link_type: category
                      link_id: 4
                      group_heading: Shop by Category
                - label: Book a Consultation
                  link_type: route
                  url: consultation
      responses:
        '200':
          description: All menus.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMenusResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

