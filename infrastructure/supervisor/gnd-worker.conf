; Laravel queue workers: image renditions, CSV imports, notifications.
[program:gnd-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/gnd/backend/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=900
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/gnd/backend/storage/logs/worker.log
stopwaitsecs=900
